<div class="row">
    <div class="col-2" >
        <h1 class="titre-result">
            {{filteredlist.length}} demandes d'achat</h1>  
    </div>
    <div class="col-3" >
        <p *ngIf="isFiltered()" >&nbsp;avec vos critères de recherche</p>
         </div>
        <div class="col-2" >
            <a *ngIf="isFiltered()" class="open-da" (click)="clearFilter()">Supprimer mes critères</a>
            </div>
    <div class="col-2" *ngIf='isOpen!=true'>
        <a class="open-da" (click)="open()"><img src="../../../../assets/img/icon-list-da.png">&nbsp;Ouvrir toutes les DA</a>
        </div>
    <div class="col-2" *ngIf='isOpen==true'>
        <a class="open-da" (click)="close()"><img src="../../../../assets/img/icon-list-da.png">&nbsp;Fermer toutes les DA</a>
    </div>
    <div >
        <p class="text-simple">DA par page</p>
    </div>
    <div class="col-1">
        <div class="btn-group" dropdown style="width:100px">
            <button id="button-basic" dropdownToggle type="button"
                class="btn btn-default ddown-per-page dropdown-toggle"
                aria-controls="dropdown-basic">{{itemsPerPage}}
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="caret"></span>
            </button>
            <ul id="dropdown-basic" *dropdownMenu class="dropdown-menu" role="menu" aria-labelledby="button-basic">
                <li role="menuitem"><a class="dropdown-item" (click)="changePerPage(10)">10</a></li>
                <li role="menuitem"><a class="dropdown-item" (click)="changePerPage(20)">20</a></li>
                <li role="menuitem"><a class="dropdown-item" (click)="changePerPage(30)">30</a></li>
            </ul>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-2">
        <p class="t-key element">Numéro <img
                (click)="sort({'column':'purchase_demand_id', 'direction':'desc'})" class="img-left"
                src="../../../../assets/img/flech-down.png"><img class="img"
                src="../../../../assets/img/flech-up.png"
                (click)="sort({'column':'purchase_demand_id', 'direction':'asc'})"> </p>
        <input type="text" class="form-control text-field-filter" [formControl]="filterCode" (keyup)="filter()"
            placeholder="Saisir pour filtrer la liste">
    </div>
    <div class="col-4">
        <p class="t-key element">Libellé <img class="img-left-label" src="../../../../assets/img/flech-down.png"
                (click)="sortText({'column':'purchase_demand_label', 'direction':'desc'})"><img
                class="img" src="../../../../assets/img/flech-up.png"
                (click)="sortText({'column':'purchase_demand_label', 'direction':'asc'})"></p>
        <input type="text" class="form-control text-field-filter" placeholder="Saisir pour filtrer la liste"
            [formControl]="filterLabel" (keyup)="filter()">
    </div>
    <div class="col-2">
        <p class="t-key element">Crée le <img class="img-left" src="../../../../assets/img/flech-down.png"
                (click)="sortDate({'column':'purchase_created_date', 'direction':'desc'})"><img
                class="img" src="../../../../assets/img/flech-up.png"
                (click)="sortDate({'column':'purchase_created_date', 'direction':'asc'})"> </p>
    </div>
    <div class="col-2">
        <p class="t-key element">Statut <img class="img-left" src="../../../../assets/img/flech-down.png"
                (click)="sort({'column':'last_status_event', 'direction':'desc'})"><img class="img"
                src="../../../../assets/img/flech-up.png"
                (click)="sort({'column':'last_status_event', 'direction':'asc'})"> </p>
        <div class="btn-group" dropdown [insideClick]="true">
            <button id="button-basic" dropdownToggle type="button"
                class="btn btn-default ddown-per-page dropdown-toggle" aria-controls="dropdown-basic">
                Tous&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <span class="caret"></span>
            </button>
            <ul *dropdownMenu class="dropdown-menu" role="menu">
                <li role="menuitem"><a class="dropdown-item">
                        <input type="checkbox" [formControl]="validated" (change)="filter()"  />
                        <img src="../../../../assets/img/icone-valide.png">&nbsp;&nbsp;<strong>Validée</strong></a>
                </li>
                <li role="menuitem"><a class="dropdown-item">
                        <input type="checkbox" [formControl]="created" (change)="filter()" />
                        <img src="../../../../assets/img/icon-cree.png">&nbsp;&nbsp;Crée</a></li>
                <li role="menuitem"><a class="dropdown-item">
                        <input type="checkbox" [formControl]="instructed" (change)="filter()" />
                        <img src="../../../../assets/img/icon-en-instruction.png">&nbsp;&nbsp;En instruction</a>
                </li>
                <li role="menuitem"><a class="dropdown-item">
                        <input type="checkbox" [formControl]="refused" (change)="filter()" />
                        <img src="../../../../assets/img/icon-refuse.png">&nbsp;&nbsp;Refusée</a>
                </li>
            </ul>
        </div>
    </div>
    <div class="col-2">
        <p class="t-key element">Statut modifié le <img class="tri-icon" src="../../../../assets/img/tri-icon.png"
                (click)="sortDate({'column':'last_status_date', 'direction':'desc'})"></p>
    </div>
</div>
