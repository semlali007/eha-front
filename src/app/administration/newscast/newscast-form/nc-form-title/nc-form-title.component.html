<div class="adm-form-group">
  <label for="nc-title" class="adm-label">
    Titre<span class="adm-required">*</span>
  </label>
  <input id="nc-title"
         class="adm-input"
         type="text"
         [formControl]="$any(title)"
         placeholder="Le titre de l'actualité"
         autocorrect="off"
         autocomplete="off">
  <span *ngIf="title?.errors?.required && title?.dirty" class="adm-field-error">Titre requis.</span>
  <span *ngIf="title?.errors?.minlength && title?.dirty" class="adm-field-error">Le titre doit faire au moins 4 caractères.</span>
</div>
