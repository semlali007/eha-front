<div>
  <p class="search-result-source">
    Date de mise à jour des informations sur les affaires&nbsp;: {{ item.statsDate }}
  </p>

  <div class="search-result-warn" *ngIf="item.count == 30">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="flex-shrink: 0">
      <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
    </svg>
    Seuls les 30 premiers résultats sont affichés. Affinez votre recherche en ajoutant un mot.
  </div>

  <div class="search-result-list">
    <a class="search-result-item" *ngFor="let result of item.items | slice:startItem:endItem" href="#!/fiche/affaire/{{ result.code }}">
      <div class="search-result-item-line">
        <span class="search-result-item-code">{{ result.code }}</span>
        <span class="search-result-item-label">{{ result.label }}</span>
      </div>
      <p class="search-result-item-other" *ngIf="result.other">{{ result.other }}</p>
    </a>
  </div>
</div>
