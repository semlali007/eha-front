<div class="search-page">
  <app-breadcrumb></app-breadcrumb>

  <header class="search-page-header">
    <h1 class="search-page-title">Recherche</h1>
    <p class="search-page-sub">Recherchez parmi les contrats, fournisseurs, articles, agences et affaires.</p>
  </header>

  <section class="search-card">
    <app-search-form (loadedResults)="onLoadedResults($event)" (resetedSearchForm)="onResetedSearchForm()"></app-search-form>
  </section>

  <app-search-result [results]="results" [reset]="reset"></app-search-result>
</div>
