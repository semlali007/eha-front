<div class="list-group card" style="width: 18rem;" *ngIf="list.length > 0">
    <button class="list-group-item" style="background-color: rgba(0, 0, 0, 0.03);" (click)="isTotalCollapsed = !isTotalCollapsed"
    [attr.aria-expanded]="!isTotalCollapsed" aria-controls="statusList">
        Statut <i class="fleche fleche-droite" [class.fleche-bas]="isTotalCollapsed == false"></i>
    </button>
    <div id="statusList" [collapse]="isTotalCollapsed" [isAnimated]="true">
    <div class="list-group list-group-flush">
        <button type="button" class="list-group-item list-group-item-action" *ngIf="status.value!='all'" (click)="changeFilter('all')"
            [class.list-group-item-success]="isActive('all')"  [attr.aria-pressed]="isActive('all')">
            Tous
        </button>

        <button type="button" class="list-group-item list-group-item-action" *ngFor="let item of list" (click)="changeFilter(item.code)"
            [class.list-group-item-success]="isActive(item.code)" [attr.aria-pressed]="isActive(item.code)">
            {{item.label}} ({{item.count}})
        </button>
    </div>
    </div>
</div>
