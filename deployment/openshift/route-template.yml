####
#
# Openshift template.
#
# Use it with oc process, passing parameters using '-p' options, it will generate a BuildConfig that you can apply.
#
# Parameters are listed at the end of this file.
#
####
---
apiVersion: template.openshift.io/v1
kind: Template
labels:
  build-template: devops_openshift-simple-route-template-route
message: "Simple Route template for EDF's DevOps / CaaS integration devops_openshift-simple-route-template"
metadata:
  annotations:
    description: "Simple Deploy template for EDF's DevOps / CaaS integration devops_openshift-simple-route-template"
  creationTimestamp: null
  name: devops_openshift-simple-route-template
objects:
  - apiVersion: v1
    kind: Route
    metadata:
      labels:
        app: app-${APPLICATION_NAME}-${ENV}-${VERSION}
      annotations:
        haproxy.router.openshift.io/timeout: ${ROUTE_TIMEOUT}
      name: app-${APPLICATION_NAME}-${ENV}-${VERSION}
    spec:
      host: ${EXTERNAL_HOST}
      port:
        targetPort: 3000
      to:
        kind: Service
        name: app-${APPLICATION_NAME}-${ENV}-${VERSION}
        weight: 100
      wildcardPolicy: None
parameters:
  - name: EXTERNAL_HOST
    required: true
  - name: APPLICATION_NAME
    required: true
  - name: VERSION
    required: true
  - name: ENV
    required: true    
  - name: ROUTE_TIMEOUT
    required: true
