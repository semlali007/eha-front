<div class="form-group">
    <strong>Directions opérationnelles (DOA) :</strong>
    <div class="row">
        <div class="col-sm-10">
            <tag-input [formControl]="directions"  [placeholder]="'Entrer une direction'" [onTextChangeDebounce]="500"
                [secondaryPlaceholder]="'Entrer une direction'" [onlyFromAutocomplete]="true">
                <tag-input-dropdown [autocompleteObservable]="requestAutocompleteItems" [minimumTextLength]="3"
                    [identifyBy]="'code'" [displayBy]="'label'">
                </tag-input-dropdown>
            </tag-input>
        </div>
        <div class="col-sm-2">
            <button type="button" class="btn btn-edf"
            (click)="openModalWithComponent()"
               >DOA</button>
        </div>
    </div>
</div>
