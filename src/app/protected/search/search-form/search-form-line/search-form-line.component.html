<div class="search-form-pgi">
  <span class="search-form-pgi-label">Limiter à un mandant PGI</span>
  <div class="search-form-pgi-list">
    <label
      *ngFor="let l of lineList"
      class="search-form-pgi-pill"
      [class.is-active]="line.value === l.code"
      [tooltip]="l.tooltip"
      placement="top">
      <input
        type="radio"
        name="radioSystem"
        [value]="l.code"
        [formControl]="line"
        (change)="changeSystem()">
      {{ l.label }}
    </label>
  </div>
</div>
