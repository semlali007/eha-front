<div class="adm-form-group">
  <label for="nc-category" class="adm-label">Catégorie</label>
  <select id="nc-category" class="adm-select" [formControl]="$any(categoryId)">
    <option [value]="0">Choisissez une catégorie</option>
    <option *ngFor="let item of categories" [ngValue]="item.id">{{ item.label }}</option>
  </select>
</div>
