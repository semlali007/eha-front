<div class="list-group card" style="width: 18rem;" *ngIf="list && list.length > 0">
    <button class="list-group-item filter-header smaller-text" (click)="isTotalCollapsed = !isTotalCollapsed"
    [attr.aria-expanded]="!isTotalCollapsed" aria-controls="categoryList">
    Catégorie d'achat <i class="fleche fleche-droite" [class.fleche-bas]="isTotalCollapsed == false"></i>
    </button>
    <div id="categoryList" [collapse]="isTotalCollapsed" [isAnimated]="true">
    <div class="list-group list-group-flush">
        <button class="list-group-item list-group-item-action" *ngIf="list && list.length > 0" (click)="changeFilter('all')"
            [class.list-group-item-success]="isActive('all')" [attr.aria-pressed]="isActive('all')">
            Tous
        </button>

        <button class="list-group-item list-group-item-action" *ngFor="let item of list|slice:0:5" (click)="changeFilter(item.code)"
            [class.list-group-item-success]="isActive(item.code)" [attr.aria-pressed]="isActive(item.code)">
            {{item.name}} ({{item.count}})
        </button>
    </div>

    <div class="list-group list-group-flush" id="collapseBasicCategory" [collapse]="isCollapsed" [isAnimated]="true">
        <button class="list-group-item list-group-item-action" *ngFor="let item of list|slice:5:14" (click)="changeFilter(item.code)"
            [class.list-group-item-success]="isActive(item.code)" [attr.aria-pressed]="isActive(item.code)">
            {{item.name}} ({{item.count}})
        </button>
    </div>

    
    </div>
    <button *ngIf="!!list && list.length > 5" type="button" class="btn btn-edf" (click)="showMore()"
        [attr.aria-expanded]="!isCollapsed" aria-controls="collapseBasicCategory">
        {{textButton}}
    </button>
</div>
