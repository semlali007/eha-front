<div class="adm-form-group">
  <label class="adm-label" for="comments">Commentaires</label>
  <div class="adm-editor-wrap">
    <editor id="comments"
            [formControl]="comments"
            [init]="{base_url: '/tinymce', suffix: '.min', language: 'fr_FR', language_url: 'assets/langs/fr_FR.js', plugins: 'advlist autolink link lists charmap print preview table', branding: false, menubar: false, height: 240}">
    </editor>
  </div>
  <span class="adm-field-hint">
    Zone libre pour toute information nécessaire non communiquée ailleurs.
  </span>
</div>
