<div [formGroup]="contract" class="adm-contract-card" [class.is-readonly]="!isActive">
  <div class="adm-contract-fields">
    <div class="adm-form-group">
      <label class="adm-label">Code contrat</label>
      <input [readonly]="!isActive"
             formControlName="code"
             type="text"
             class="adm-input"
             placeholder="Ex : C12345678">
      <div class="adm-field-hint" *ngIf="code.pending">
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        Vérification…
      </div>
      <span *ngIf="code.errors && isActive" class="adm-field-error">
        <ng-container *ngIf="code.errors.required">Code requis.</ng-container>
        <ng-container *ngIf="code.errors.minlength">Le code doit faire au moins 9 caractères.</ng-container>
        <ng-container *ngIf="code.errors.maxlength">Le code doit faire moins de 10 caractères.</ng-container>
        <ng-container *ngIf="code.errors.pattern">Le code doit commencer par un "C".</ng-container>
        <ng-container *ngIf="code?.errors?.invalidContractCode">Ce code n'existe pas.</ng-container>
      </span>
    </div>

    <div class="adm-form-group">
      <label class="adm-label">Fournisseur</label>
      <textarea [readonly]="!isActive"
                formControlName="provider"
                class="adm-textarea"
                rows="2"
                placeholder="Nom du fournisseur"></textarea>
    </div>

    <div class="adm-form-group">
      <label class="adm-label">Lot associé</label>
      <select formControlName="lots"
              class="adm-select"
              [style.pointer-events]="isActive ? 'auto' : 'none'"
              [style.opacity]="isActive ? '1' : '0.6'">
        <option value="">{{ isActive ? 'Sélectionner un lot' : 'Mode lecture' }}</option>
        <option *ngFor="let lot of filteredLots" [value]="lot">{{ lot }}</option>
      </select>
    </div>

    <div class="adm-form-group adm-contract-contacts">
      <label class="adm-label">Contacts fournisseur</label>
      <div class="adm-editor-wrap" *ngIf="isActive">
        <editor formControlName="contacts"
                id="contact{{ index }}"
                [init]="{base_url: '/tinymce', suffix: '.min', language: 'fr_FR', plugins: 'advlist autolink link lists charmap print preview table', branding: false, menubar: false, height: 180}">
        </editor>
      </div>
      <div *ngIf="!isActive" class="adm-contract-contacts-readonly" [innerHTML]="contract.value.contacts"></div>
    </div>
  </div>

  <div class="adm-contract-actions">
    <button type="button" class="adm-btn adm-btn-ghost adm-btn-sm" (click)="changeState(index)" title="{{ isActive ? 'Verrouiller' : 'Modifier' }}">
      <svg *ngIf="!isActive" xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125"/>
      </svg>
      <svg *ngIf="isActive" xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
      </svg>
      {{ isActive ? 'Verrouiller' : 'Modifier' }}
    </button>
    <button type="button" class="adm-btn adm-btn-danger adm-btn-sm" (click)="confirmation(template)">
      Supprimer
    </button>
  </div>
</div>

<ng-template #template>
  <div class="adm-modal-body" style="text-align:center">
    <p style="margin: 0 0 14px 0; font-weight: 600; color: #1f2937">Confirmer la suppression ?</p>
    <div style="display: flex; justify-content: center; gap: 8px">
      <button type="button" class="adm-btn adm-btn-ghost" (click)="decline()">Annuler</button>
      <button type="button" class="adm-btn adm-btn-danger" (click)="confirm()">Oui, supprimer</button>
    </div>
  </div>
</ng-template>
