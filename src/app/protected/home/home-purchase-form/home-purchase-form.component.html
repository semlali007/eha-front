


<div class="my-title-for-searches">
    Ma situation Achat
</div>

<div class="list-group-item border-green">
            <span [hidden]="!page?.active"><span class="badge badge-primary my-title-for-searches" >NOUVEAU</span><img class="mt-1" src="../../../../assets/img/info-icon-green.png" style="width: 15.83px;margin-left: 10px;color:RGB(80,158,47) ;padding-bottom: 7.16px !important;" /> <span (click)="openModalWithComponent()" class="link" style="color:RGB(80,158,47)"> en savoir plus</span></span>

            <ul style="padding-left: 25px;">
                <li><strong><a href="javascript: void(0);" (click)="show()" style="color:RGB(80,158,47);">Afficher toutes mes demandes d'achat</a></strong></li>
                <li style="color: #333333; margin-top: 10px;">Ou rechercher :</li>
            </ul>

            <form class="my-form-for-searches" role="search" novalidate [formGroup]="homePurchaseForm" (ngSubmit)="submit()">
                <div class="row">
                    <div class="col-12">
                        <input type="search" class="form-control" [formControl]="searchText"
                            placeholder="Saisir un numéro de DA" id="searchText">
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-search" [disabled]="!homePurchaseForm.valid">Rechercher</button>
                    </div>
                </div>
            </form>
        </div>
