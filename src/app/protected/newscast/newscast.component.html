<div class="newscast-page">
  <app-breadcrumb></app-breadcrumb>

  <!-- Header -->
  <div class="newscast-header">
    <div class="newscast-title">
      <img src="assets/img/mdi_announcement.png"
        srcset="assets/img/mdi_announcement@2x.png 2x, assets/img/mdi_announcement@3x.png 3x"
        class="newscast-title-icon">
      <span>Actualités</span>
    </div>
    <form [formGroup]="newsCastFilterForm" class="newscast-filter">
      <label class="newscast-filter-label">Afficher</label>
      <select class="newscast-filter-select" (change)="changeCategory($event)">
        <option value="">Tous les articles</option>
        <option *ngFor="let category of categories" [value]="category.id">{{ category.label }}</option>
      </select>
    </form>
  </div>

  <!-- Liste des articles -->
  <div class="newscast-list">
    <div class="newscast-article" *ngFor="let item of items.data; index as i;">
      <div class="newscast-article-meta">
        <span class="badge {{ item.categ_code | newsCastCategoryColor }}">{{ item.categ }}</span>
        <span class="newscast-article-date">Publié le {{ item.published_date | customDate: "dd.MM.yyyy" }}</span>
      </div>
      <h3 class="newscast-article-title">{{ item.title }}</h3>
      <p class="newscast-article-desc" [innerHtml]="item.short_description"></p>
      <a class="newscast-article-link" (click)="navigate(item.id, i)">Lire la suite</a>
    </div>

    <!-- Aucun résultat -->
    <div *ngIf="!!items && !!items.data && items.data.length === 0" class="newscast-empty">
      Aucun article trouvé
    </div>
  </div>

  <!-- Pagination -->
  <div class="newscast-pagination" *ngIf="count > itemsPerPage">
    <p class="newscast-pagination-info">Page {{ this.currentPage.value }} sur {{ totalPage }}</p>
    <form [formGroup]="paginationForm">
      <nav aria-label="pagination">
        <pagination
          [totalItems]="count"
          [itemsPerPage]="itemsPerPage"
          [formControl]="currentPage"
          (pageChanged)="pageChanged($event)"
          [maxSize]="10"
          (numPages)="smallnumPages = $event"
          previousText="&lsaquo;"
          nextText="&rsaquo;"
          firstText="&laquo;"
          lastText="&raquo;">
        </pagination>
      </nav>
    </form>
  </div>
</div>
