<div class="modal-content">
    <div class="modal-header">
        <h5 class="modal-title">Ajouter un élément</h5>
        <button type="button" class="close" aria-label="Close" (click)="bsModalRef.hide()">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <form novalidate [formGroup]="editForm" (ngSubmit)="submit()">
            <div class="form-group">
                <label for="title"><strong>Titre :</strong></label>
                <input type="text" class="form-control" placeholder="titre" [formControl]="title">
            </div>

            <div class="form-group">
                <label for="url"><strong>URL :</strong></label>
                <input type="text" class="form-control" placeholder="url" [formControl]="url">
            </div>
            <div class="form-group row">
                <div class="col-sm-3">
                    <strong>Lien externe:</strong>
                </div>
                <div class="col-sm-9">
                    <div class="form-check">
                        <input type="checkbox" [formControl]="external" id="external" class="form-check-input" />
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="description"><strong>Description :</strong></label>
                <div>
                    <textarea formControlName="description" class="form-control"
                        [placeholder]="'description'"></textarea>
                </div>
            </div>
            <div class="form-group">
                <label for="warning"><strong>Message(alerte):</strong></label>
                <div>
                    <textarea formControlName="warning" class="form-control" [placeholder]="'Message'"></textarea>
                </div>
            </div>
            <div class="form-group">
                <div class="row">
                    <div class="col-sm-12">
                        <div class="col-sm-3">
                            <strong>File d'ariane:</strong>
                        </div>
                        <input type="text" name="breadcrumb" formControlName="breadcrumb" id="breadcrumb"
                            class="form-control">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-primary" (click)="submit()" [disabled]="!editForm.valid">Valider</button>
        <button type="button" class="btn btn-secondary" (click)="bsModalRef.hide()">Annuler</button>
    </div>
</div>
