<div class="form-group">
    <div class="label-with-icon">
        <strong>Bénéficiaires :</strong><span class="required">*</span>
        <span class="info-icon"
            tooltip="Entités du groupe (filiales, CCAS, Fondation Groupe, etc ; si toutes les entités Groupe,  préciser tel que défini dans les CPA : ex 'toutes entités du Groupe')"
            placement="top" role="img" aria-label="Information"></span>
    </div>
    <div class="row">
        <div class="col-sm-10">
            <tag-input [formControl]="beneficiaries"  [placeholder]="''" [onTextChangeDebounce]="500"
                [secondaryPlaceholder]="''" [onlyFromAutocomplete]="true">
                <tag-input-dropdown [autocompleteObservable]="requestAutocompleteItems" [minimumTextLength]="3"
                    [identifyBy]="'code'" [displayBy]="'label'">
                </tag-input-dropdown>
            </tag-input>
        </div>
        <div class="col-sm-2">
            <button type="button" class="btn btn-edf"
            (click)="openModalWithComponent()"
               >Bénéficiaires</button>
        </div>
    </div>
    <small *ngIf="beneficiaries.errors" class="form-text text-danger">
        <span [hidden]="!beneficiaries.errors.required">
            Bénéficiaires requis.
        </span>
       
    </small>
</div>
