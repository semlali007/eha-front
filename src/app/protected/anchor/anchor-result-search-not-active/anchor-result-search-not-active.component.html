<div class="anc-result-head" *ngIf="notActiveProviders.length > 0">
  <span class="anc-badge anc-badge--inactive">
    <span class="anc-dot"></span> Sans contrat actif
  </span>
  <span class="anc-result-count"><strong>{{ notActiveProviders.length }}</strong> fournisseur(s)</span>
</div>

<div class="anc-list" *ngIf="notActiveProviders.length > 0">
  <div class="anc-item" *ngFor="let row of notActiveProviders | slice:startItem:endItem">
    <div class="anc-item-body">
      <div class="anc-item-title">
        <span class="anc-distance" *ngIf="row.distance > -1">{{ row.distance }} km</span>
        {{ row.label }}
      </div>
      <div class="anc-item-sub">{{ row.zipcode }} {{ row.town }}</div>
    </div>
  </div>
</div>

<div class="anc-empty" *ngIf="notActiveProviders.length == 0">
  Aucun fournisseur sans contrat actif proche de ce code postal.
</div>

<div class="anc-pager" *ngIf="notActiveProviders.length > 0">
  <span class="anc-pager-info">Page {{ this.currentPage.value }} / {{ totalPage }}</span>
  <form [formGroup]="paginationForm">
    <pagination class="anc-pagination" [totalItems]="notActiveProviders.length" [itemsPerPage]="itemsPerPage"
      [formControl]="currentPage" (pageChanged)="pageChanged($event)" [maxSize]="7"
      (numPages)="smallnumPages = $event" previousText="&lsaquo;" nextText="&rsaquo;">
    </pagination>
  </form>
</div>
