<div class="list-group cadre">
  <div class="row-table full-width">
    <div class="col-5"><p class="titre-cadre">
      <img class="image-info" src="../../../../assets/img/icon-se-documenter.png">&nbsp;Se documenter</p></div>
    <div class="col-7"><p class="p-danger">Accès limité aux collaborateurs d'EDF</p></div>
  </div>
  <p class="p">Accéder à des aides et ressources documentaires adaptées à chaque phase du processus Achat :</p>

  <div class="doc-list">
    <div class="doc-item" *ngFor="let document of section" (click)="navigate(document)"
         [attr.title]="document.link?.includes('http') ? 'Ouvrir dans un nouvel onglet' : (document.link?.includes('mailto') ? 'Écrire un e-mail' : 'Ouvrir')">
      <div class="doc-item-main">
        <div class="doc-item-title" [innerHtml]="document.label"></div>
        <div class="doc-item-desc">{{document.shortdescription}}</div>
      </div>

      <!-- Lien externe (nouvel onglet) -->
      <span class="doc-item-icon doc-item-icon--ext" *ngIf="document.link?.includes('http')">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/>
        </svg>
      </span>
      <!-- Lien e-mail -->
      <span class="doc-item-icon doc-item-icon--mail" *ngIf="document.link?.includes('mailto')">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/>
        </svg>
      </span>
      <!-- Navigation interne -->
      <span class="doc-item-icon doc-item-icon--go" *ngIf="!document.link?.includes('http') && !document.link?.includes('mailto')">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
        </svg>
      </span>
    </div>
  </div>
</div>
