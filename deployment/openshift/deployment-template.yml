####
#
# Openshift template.
#
# Use it with oc process, passing parameters using '-p' options, it will generate a BuildConfig that you can apply.
#
# Parameters are listed at the end of this file.
#
####
---
apiVersion: template.openshift.io/v1
kind: Template
labels:
  build-template: devops_openshift-simple-deploy-template-Deployment
message: "Simple Deployment template for EDF's DevOps / CaaS integration devops_openshift-simple-deploy-template"
metadata:
  annotations:
    description: "Simple Deployment template for EDF's DevOps / CaaS integration devops_openshift-simple-deploy-template"    
  creationTimestamp: null
  name: devops_openshift-simple-deploy-template
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      annotations:      
          image.openshift.io/triggers: >-
            [{"from":{"kind":"ImageStreamTag","name":"${FROM_IMAGE}:${VERSION}"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app-${APPLICATION_NAME}-${ENV}-${VERSION}\")].image"}]
      labels:
        app: app-${APPLICATION_NAME}-${ENV}-${VERSION}
      name: app-${APPLICATION_NAME}-${ENV}-${VERSION}
    spec:
      revisionHistoryLimit: 3
      replicas: 1
      selector:
        matchLabels:
          app: app-${APPLICATION_NAME}-${ENV}-${VERSION}
      strategy:
        type: Recreate
      template:
        metadata:
          labels:
            app: app-${APPLICATION_NAME}-${ENV}-${VERSION}
        spec:
          containers:
            - name: nginx-rp
              image: >-
                ${LOCAL_REGISTRY}/openshift/dck_nginx-ubi8:1.24
              ports:
                - containerPort: 8080
                  protocol: TCP
              command:
                - /usr/libexec/s2i/run
              resources:
                limits:
                  cpu: 250m
                  memory: 256Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: appli-sharing
                  mountPath: /appli/projects/EHA/nginx_1.24/html
                - name: test-app-nginx-volume-1
                  mountPath: /var/projects/instance/nginx_1.24/cache/
                - name: test-app-nginx-volume-2
                  mountPath: /var/projects/instance/nginx_1.24/run/
                - name: nginx-conf
                  mountPath: /appli/projects/instance/nginx/conf
                - name: app-nginx-crt
                  mountPath: /var/lib/nginx/ssl
                - name: client-body
                  mountPath: /var/projects/instance/nginx_1/run/nginx-client-body
                - name: client-cache
                  mountPath: /var/lib/nginx/cache/proxy_cache
                - name: proxy-temp
                  mountPath: /opt/nginx/1.24.0/proxy_temp
                - name: fastcgi-temp
                  mountPath: /opt/nginx/1.24.0/fastcgi_temp
                - name: uwsgi-temp
                  mountPath: /opt/nginx/1.24.0/uwsgi_temp
                - name: scgi-temp
                  mountPath: /opt/nginx/1.24.0/scgi_temp
                - name: pid-vol
                  mountPath: /opt/nginx/1.24.0/logs/
                  subPath: nginx.pid
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              imagePullPolicy: Always
            - env:
                - name: SECRETS_PADAONE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      key: PUSERNAME
                      name: padaone-credentials-${ENV}
                - name: SECRETS_PADAONE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: PPASSWORD
                      name: padaone-credentials-${ENV}
              image: ${LOCAL_REGISTRY}/openshift/dck_filebeat-ubi:7.9.3
              imagePullPolicy: IfNotPresent
              name: filebeat-container
              ports:
                - containerPort: 80
                  protocol: TCP
              resources: {}
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              volumeMounts:
                - mountPath: /var/projects/EHA/php-fpm_8.2/log/
                  name: log-dir
                - mountPath: /opt/filebeat/config/
                  name: filebeat-config-volume
                  readOnly: true
                - mountPath: /opt/filebeat/data/
                  name: filebeat-data-volume
          dnsPolicy: ClusterFirst                
          restartPolicy: Always
          securityContext: {}
          serviceAccount: achatpedia-caas-eha
          serviceAccountName: achatpedia-caas-eha
          schedulerName: default-scheduler          
          terminationGracePeriodSeconds: 30
          volumes:
            - name: appli-tmp
              emptyDir: {}
            - name: appli-sharing
              emptyDir: {}
            - name: log-dir
              emptyDir: {}
            - name: test-app-nginx-volume-1
              emptyDir: {}
            - name: test-app-nginx-volume-2
              emptyDir: {}
            - name: client-body
              emptyDir: {}
            - name: client-cache
              emptyDir: {}
            - name: proxy-temp
              emptyDir: {}
            - name: fastcgi-temp
              emptyDir: {}
            - name: scgi-temp
              emptyDir: {}
            - name: uwsgi-temp
              emptyDir: {}
            - name: pid-vol
              emptyDir: {}
            - name: nginx-conf
              configMap:
                name: cm-rp-nginx
                defaultMode: 420
            - name: app-nginx-crt
              secret:
                secretName: app-nginx-crt
                defaultMode: 420
            - name: backend-config
              configMap:
                name: cm-app-${APPLICATION_NAME}-${ENV}-${VERSION}
                defaultMode: 420
            - name: filebeat-data-volume
              emptyDir: {}
            - configMap:
                defaultMode: 420
                name: cm-app-${APPLICATION_NAME}-${ENV}-${VERSION}
              name: filebeat-config-volume      
parameters:
  - name: FROM_NAMESPACE
    required: true
  - name: FROM_IMAGE
    required: true
  - name: APPLICATION_NAME
    required: true
  - name: VERSION
    required: true
  - name: ENV
    required: true
  - name: PVC_NAME
    required: true
  - name: CPU_LIMIT
    required: true
  - name: CPU_REQUEST
    required: true
  - name: MEMORY_LIMIT
    required: true    
  - name: MEMORY_REQUEST
    required: true                
  - name: LOCAL_REGISTRY
    required: true
    value: "image-registry.openshift-image-registry.svc:5000"

