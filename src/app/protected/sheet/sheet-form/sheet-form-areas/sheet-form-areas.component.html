<div class="adm-form-group">
  <label class="adm-label">
    Zone géographique<span class="adm-required">*</span>
  </label>
  <select class="adm-select" [formControl]="areas" [compareWith]="compareAreas" required>
    <option value="">Sélectionnez une zone géographique…</option>
    <option *ngFor="let area of availableAreas" [ngValue]="area">{{ area.label }}</option>
  </select>
  <span *ngIf="isLoading" class="adm-field-hint">Chargement des zones…</span>
  <span *ngIf="!isLoading && availableAreas.length === 0" class="adm-field-error">
    Aucune zone disponible.
  </span>
  <span class="adm-field-hint" *ngIf="!isLoading && availableAreas.length > 0">
    Options : France métropolitaine (hors Corse) · France métropolitaine + Corse · France métropolitaine + Corse + DROM · France et international.
  </span>
  <span *ngIf="areas.errors && areas.touched" class="adm-field-error">
    <ng-container *ngIf="areas.errors.required">Zone géographique requise.</ng-container>
  </span>
</div>
