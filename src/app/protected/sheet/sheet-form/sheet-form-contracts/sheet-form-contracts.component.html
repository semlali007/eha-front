<div [formGroup]="sheetForm" class="adm-form-group">
  <label class="adm-label">
    Numéros de contrats<span class="adm-required">*</span>
  </label>

  <div formArrayName="contracts" class="adm-array-list">
    <app-sheet-form-contracts-item [actualState]="obj"
                                    *ngFor="let contract of contracts.controls; index as i;"
                                    [index]="i"
                                    [contract]="contract"
                                    [isActive]="isActive(i)"
                                    [lotsListForContract]="tableLot"
                                    [providersForContract]="providersForContract"
                                    (openClose)="onOpenClose($event)"
                                    (removedContract)="onRemovedContract($event)">
    </app-sheet-form-contracts-item>

    <div *ngIf="contracts.controls.length === 0" class="adm-array-empty">
      Aucun contrat ajouté pour le moment.
    </div>
  </div>

  <div class="adm-array-add">
    <app-sheet-form-contracts-add (addedContract)="onAddedContract()"></app-sheet-form-contracts-add>
  </div>

  <span *ngIf="contracts.errors && contracts.touched" class="adm-field-error">
    <ng-container *ngIf="contracts.errors.required">Au moins un contrat est requis.</ng-container>
  </span>
</div>
