<div class="filter-panel sticky-top">

  <div class="filter-panel-header">
    <span class="filter-panel-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16" style="margin-right:6px;vertical-align:-1px">
        <path d="M6 10.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5z"/>
      </svg>
      Filtres
      <span class="filter-count-badge" *ngIf="activeFilterCount > 0">{{ activeFilterCount }}</span>
    </span>
    <div class="filter-panel-actions">
      <button *ngIf="activeFilterCount > 0" class="filter-clear-btn" (click)="clearAll()" type="button">
        Effacer tout
      </button>
      <button class="filter-toggle-btn" (click)="toggleAll()" type="button"
        [title]="allCollapsed ? 'Déplier tous les filtres' : 'Replier tous les filtres'">
        <svg *ngIf="allCollapsed" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"/>
        </svg>
        <svg *ngIf="!allCollapsed" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M7.646 4.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1-.708.708L8 5.707l-5.646 5.647a.5.5 0 0 1-.708-.708l6-6z"/>
        </svg>
      </button>
    </div>
  </div>

  <form novalidate [formGroup]="sheetFilterForm" class="filter-sections" #filterSections>

    <app-sheet-list-filter-subscribe [subscribe]='subscribe' [list]="filter.subscribe"
      (changedFilter)="onChangedFilterSheets($event)">
    </app-sheet-list-filter-subscribe>

    <app-sheet-list-filter-date [resetFilters$]="resetFilters$"
      [defaultDateStart]="defaultFilter?.dateStart || ''"
      [defaultDateEnd]="defaultFilter?.dateEnd || ''"
      (onFiltersChange)="onDateFiltersChange($event)">
    </app-sheet-list-filter-date>

    <app-sheet-list-filter-contrat-groupe [contratGroupe]='contratGroupe' [list]="filter.contratGroupe"
      (changedFilter)="onChangedFilterSheets($event)">
    </app-sheet-list-filter-contrat-groupe>

    <app-sheet-list-filter-mise-a-jour-donnee [miseAJourDonnee]='miseAJourDonnee'
      [list]="filter.miseAJourDonnee" (changedFilter)="onChangedFilterSheets($event)">
    </app-sheet-list-filter-mise-a-jour-donnee>

    <app-sheet-list-filter-status
      *ngIf="!!user && (user.hasRole('EHA_ADMIN') || user.hasRole('EHA_GESTIONNAIRE'))"
      [status]='status' [list]="filter.status" (changedFilter)="onChangedFilterSheets($event)">
    </app-sheet-list-filter-status>

    <app-sheet-list-filter-beneficiary [beneficiaries]='beneficiaries' [list]="filter.beneficiaries"
      (changedFilter)="onChangedFilterSheets($event)" [data]="data">
    </app-sheet-list-filter-beneficiary>

    <app-sheet-list-filter-stipulation [stipulationAutrui]='stipulationAutrui' [list]="filter.stipulationAutrui"
      (changedFilter)="onChangedFilterSheets($event)" [data]="data"
      *ngIf="!shouldHideFilterInContratGroupeMode('stipulationAutrui')">
    </app-sheet-list-filter-stipulation>

    <app-sheet-list-filter-area [areas]='areas' [list]="filter.areas"
      (changedFilter)="onChangedFilterSheets($event)">
    </app-sheet-list-filter-area>

    <app-sheet-list-filter-provider [providers]='providers' [list]="filter.providers"
      (changedFilter)="onChangedFilterSheets($event)">
    </app-sheet-list-filter-provider>

    <app-sheet-list-filter-direction [directions]='directions' [list]="filter.directions"
      (changedFilter)="onChangedFilterSheets($event)"
      *ngIf="!shouldHideFilterInContratGroupeMode('directions')">
    </app-sheet-list-filter-direction>

    <app-sheet-list-filter-edf-open [edfOpen]='edfOpen' [list]="filter.edfOpen"
      (changedFilter)="onChangedFilterSheets($event)">
    </app-sheet-list-filter-edf-open>

    <app-sheet-list-filter-partnership [partnership]='partnership' [list]="filter.partnership"
      (changedFilter)="onChangedFilterSheets($event)"
      *ngIf="!shouldHideFilterInContratGroupeMode('partnership')">
    </app-sheet-list-filter-partnership>

    <app-sheet-list-filter-dauphin [dauphin]='dauphin' [list]="filter.dauphin"
      (changedFilter)="onChangedFilterSheets($event)"
      *ngIf="!shouldHideFilterInContratGroupeMode('dauphin')">
    </app-sheet-list-filter-dauphin>

    <app-sheet-list-filter-category [categories]='categories' [list]="filter.categories"
      (changedFilter)="onChangedFilterSheets($event)"
      *ngIf="!shouldHideFilterInContratGroupeMode('categories')">
    </app-sheet-list-filter-category>

    <app-sheet-list-filter-committee [committees]='committees' [list]="filter.committees"
      (changedFilter)="onChangedFilterSheets($event)"
      *ngIf="!shouldHideFilterInContratGroupeMode('committees')">
    </app-sheet-list-filter-committee>

  </form>
</div>
