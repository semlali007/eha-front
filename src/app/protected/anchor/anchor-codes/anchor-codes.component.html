<div class="modal-header" style="min-width: 800px;">
    <h5 class="modal-title">Liste des codes/libellés NACE</h5>
    <button type="button" class="close" (click)="bsModalRef.hide()" aria-label="Close">
        <span aria-hidden="true">&times;</span>
    </button>
</div> <form [formGroup]="codesForm" >
<div class="modal-body vertical-scrollable">
<p>
    <input [formControl]="codeFilter" type="text" placeholder="Filtrer sur le code" (input)="toggleFilter('code')">
</p>
<p>
    <input [formControl]="labelFilter" type="text" placeholder="Filtrer sur le labellé" (input)="toggleFilter('label')">
</p>
<button type="button" class="btn btn-secondary" (click)="resetFilters()">Réinitialiser les filtres</button>
<ul class="list-group">
    <li class="list-group-item" *ngFor="let row of filteredCodes">
        <b>{{row[0]}}</b> {{row[1]}}
        <span style="float:right">
            <button class="btn btn-edf" (click)="addToList(row)" *ngIf="!isSelected(row)">Sélectionner</button>
        </span>
            <span style="float:right"> <button
            class="btn btn-edf" (click)="removeItemFromList(row)" *ngIf="isSelected(row)">Retirer</button>
        </span>
        </li>
    </ul>
</div>
</form>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary"  (click)="bsModalRef.hide()">{{closeBtnName}}</button>
</div>
