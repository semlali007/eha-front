<div class="form-group" *ngIf="miseAJourDonnee">
    <label for="mise_a_jour_donnee" class="label-with-icon">
        <strong>Mise à jour de la donnée (information temporaire) :</strong>
        <span class="info-icon" 
              tooltip="une donnée temporaire utilisée dans le cadre de la mise à jour globale achatpédia S2 2025"
              placement="top"
              role="img"
              aria-label="Information"></span>
    </label>
    <select id="mise_a_jour_donnee" [formControl]="miseAJourDonnee" class="form-control select-width">
        <option value="non">Non</option>
        <option value="en_cours">En cours</option>
        <option value="oui">Oui</option>
    </select>
</div>
