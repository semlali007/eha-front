<div class="row">
<hr class="ligne-table">
<div class="col-2">
    <p class="text" *ngIf="!isOpened;else opened"><img src='../../../../assets/img/element-table.png' class="dark-blue"><img src="../../../../assets/img/element-table-hover.png" class="light-blue">&nbsp;&nbsp;&nbsp;{{item.purchase_demand_id}}</p>
   
</div>
<div class="col-4" style="padding: 0;">
    <p class="text">{{slicedLabel|slice:0:40}}<span *ngIf="slicedLabel.length >45">..</span></p>
</div>
<div class="col-2">
    <p class="text">{{item.purchase_created_date|customDate}}</p>
</div>
<div class="col-2" [ngSwitch]="item.last_status_event" style="font-size:15px">
    <p *ngSwitchCase="1"><img src="../../../../assets/img/icon-initilaisee.png">&nbsp; Initialisée
    </p>
    <p *ngSwitchCase="2"><img src="../../../../assets/img/icone-transmise-pha.png">&nbsp; 
        Transmise PHA</p>
    <p *ngSwitchCase="3"><img src="../../../../assets/img/icone-soumise-au-manager.png">&nbsp; Soumise au manager</p>
    <p *ngSwitchCase="4"><img src="../../../../assets/img/icone-affecter-a-lachteur.png">&nbsp;
        Affectée à l'acheteur</p>
        <p *ngSwitchCase="5"><img src="../../../../assets/img/icon-integre-en-affaire.png">&nbsp;
            Intégrée en affaire</p>


            <p *ngSwitchCase="6"><img src="../../../../assets/img/icon-refuse.png">&nbsp;
                Refusée</p>
               

            
</div>
<div class="col-2">
    <p class="text">{{item.last_status_date|customDate}}</p>
</div>
</div>
<ng-template #opened><p class="text"><img src='../../../../assets/img/element-table-bas.png' class="dark-blue"><img src="../../../../assets/img/element-table-hover.png" [ngClass]="{'light-blue' : true, 'light-blue-rotate':isOpened}">&nbsp;&nbsp;&nbsp;{{item.purchase_demand_id}}</p></ng-template>
