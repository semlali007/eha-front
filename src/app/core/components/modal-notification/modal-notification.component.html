<div class="modal-body">
  <div class="row">
    <div class="col-2">
      <img class="mt-3" src="../../../../assets/img/icone-notification-noir.png" />
    </div>
    <div class="col-10 text-justify">
      <div class="offset-11">
        <span aria-hidden="true" style="cursor:pointer" class="visually-hidden close d-inline" (click)="hideModal()"
          aria-label="Close">&times;</span>
      </div>
      <h1 class="font-weight-bold pt-2" style="color:var(--my-color-darkblue)">Liste des notifications</h1>
      <p class="pr-3"></p>
      <table class="table">
        <tbody>
          <ul *ngIf="list?.length > 0;else ngelse">
          <tr *ngFor="let i of list">
            <td> 
              <li><p class="font-weight-light">La fiche marché <strong>{{ i.label}}</strong > a été modifiée le <strong style="color:var(--my-color-green)">{{ i.updated_at | date:
                'dd/MM/yyyy' }}</strong></p></li> 
            </td>
          </tr> 
        </ul>
        </tbody>
      </table>
    </div>
  </div>
</div>
<ng-template #ngelse>
  
      <p class="font-weight-light">Aucune nouvelle notification</p>
    
</ng-template>
