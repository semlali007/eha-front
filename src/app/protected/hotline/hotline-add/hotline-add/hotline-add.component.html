<div class="adm-page-wrap hl-page">
  <app-breadcrumb></app-breadcrumb>

  <!-- Header : titre + lien retour vers la liste -->
  <header class="hl-header">
    <div class="hl-header-left">
      <h1 class="hl-title">Nouvelle demande à la hotline</h1>
      <p class="hl-sub">
        Afin que nous vous répondions au mieux, veuillez préciser si besoin le numéro de contrat en rapport avec votre question. Merci.
      </p>
      <p class="hl-sub">
        Maintenant, vous pouvez remplir le formulaire ci-après pour poser votre question :
      </p>
    </div>
    <button type="button" class="adm-btn adm-btn-ghost" (click)="showList()">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 010 3.75H5.625a1.875 1.875 0 010-3.75z"/>
      </svg>
      Retrouver mes demandes
    </button>
  </header>

  <!-- Bandeau réponse / confirmation après envoi -->
  <div class="hl-feedback" *ngIf="message.length > 0">
    <span class="hl-feedback-icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </span>
    <div class="hl-feedback-content">
      <div [innerHTML]="message"></div>
      <button type="button" class="adm-btn adm-btn-ghost adm-btn-sm" (click)="reload()">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0011.667 0l3.181-3.183m-4.991-2.69h4.99v4.991M2.985 4.356V9.35m0 0h4.992M2.985 9.35l3.181-3.182a8.25 8.25 0 0111.668 0l3.181 3.182"/>
        </svg>
        Actualiser la page
      </button>
    </div>
  </div>

  <!-- Formulaire -->
  <app-hotline-form *ngIf="message.length === 0" (loadedResponse)="onloadedResponse($event)"></app-hotline-form>
</div>
