<div class="container-fluid">
  <app-breadcrumb></app-breadcrumb>
  <div class="row sidenav">
    <div class="col-md-3">
          <app-sheet-list-filter (submittedFilterSheets)="onSubmittedFilterSheets($event)" [filter]="filter" [defaultFilter]='defaultFilter.search' [user]='user' [data]="data">
          </app-sheet-list-filter>
    </div>
    <div class="col-md-9" style="margin-top:-8px;">
      <div class="row justify-content-center">
        <div class="col-12">
          <div class="row">
            <div class="col-lg-12">
              <div class="form-group row">
                <div class="col-9 col-sm-9"><span *ngIf="activeText" [innerHtml]="welcomeText"></span></div>
                <div class="col-3 col-sm-3" *ngIf="!!user && (user.hasRole('EHA_ADMIN') || user.hasRole('EHA_GESTIONNAIRE'))">
                  <a (click)="navigate('fiche_marchee')" class="btn btn-sheet-search"><i class="fas fa-plus"></i>
                    Ajouter une fiche</a>
                </div>
              </div>
              <app-sheet-list-export class="form-group row" [params]="params">
              </app-sheet-list-export>

              <app-sheet-list-search-form (submittedSearchSheets)="onsSubmittedSearchSheets($event)" [defaultFilter]='defaultFilter'>
              </app-sheet-list-search-form>
              <app-sheet-list-sort (changedSort)="onChangedSort($event)" [defaultFilter]='defaultFilter'>
              </app-sheet-list-sort>
            </div>
          </div>
          <div>
            <!-- Indicateur de mode Contrat Groupe -->
            <div *ngIf="isContratGroupeMode()" class="alert alert-info contrat-groupe-indicator d-flex align-items-center mb-3" role="alert">
              <i class="fas fa-handshake me-2" style="font-size: 1.3em; color: #2196f3;"></i>
              <div class="flex-grow-1">
                <strong style="color: #1976d2;">Mode Contrat Groupe activé</strong>
                <small class="d-block text-muted mt-1">Affichage filtré sur les fiches avec contrat groupe uniquement</small>
              </div>
              <button type="button" class="btn btn-outline-secondary btn-sm ms-3" (click)="accederVitrineOffre()" title="Quitter le mode Contrat Groupe">
                <i class="fas fa-times me-1"></i>
                Quitter
              </button>
            </div>
          </div>

          <div>
            <div>
              <div class="tab-content">
                <div class="active">
                  <div>
                    <div class="list-group my-items-for-trainings" *ngIf="sheets">
                      <app-sheet-list-item *ngFor="let sheet of sheets" [sheet]="sheet" [comments]="sheet.comments"
                        [title]="sheet.title" [date]="sheet.updatedAt" [createdAt]="sheet.createdAt" [statusCode]="sheet.status" [id]="sheet.id" [subscribed]="sheet.subscribed"
                        (sheetRemoved)="onSheetRemoved(sheet)" class="list-group my-items-for-trainings" (submittedGetSheet)="onSubmittedGetSheet($event)" (onSubscribe)="loadItems()"  [user]='user'>
                      </app-sheet-list-item>
                      <h5 *ngIf="filterInput.subscribe && filter.subscribe['count'] == 0" class="noSub">Vous n'êtes abonné à aucune fiche</h5>
                      <div class="row">

                        <form class="col-xs-12 col-12" [formGroup]="paginationForm">
                          <nav aria-label="pagination" >
                          <pagination [boundaryLinks]="true" [totalItems]="totalItems" [itemsPerPage]="itemsPerPage"
                            [formControl]="currentPage" (pageChanged)="pageChanged($event)" [maxSize]="10"
                            (numPages)="smallnumPages = $event" previousText="&lsaquo;" nextText="&rsaquo;"
                            firstText="&laquo;" lastText="&raquo;">
                          </pagination>
                          </nav>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
