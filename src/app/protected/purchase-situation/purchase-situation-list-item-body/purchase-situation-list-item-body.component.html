<div class="ps-body">
  <div class="ps-body-desc" [innerHTML]="purchase.need_mtb_desc"></div>

  <div class="ps-body-meta">
    <div class="ps-meta-item">
      <span class="ps-meta-label">Catégorie achat</span>
      <span class="ps-meta-value">{{ purchase.mtb_purchase_category_label_list || '—' }}</span>
    </div>
    <div class="ps-meta-item">
      <span class="ps-meta-label">Direction</span>
      <span class="ps-meta-value">{{ purchase.buyer_party_level_1_label || '—' }}</span>
    </div>
    <div class="ps-meta-item">
      <span class="ps-meta-label">Division</span>
      <span class="ps-meta-value">{{ purchase.buyer_party_level_2_label || '—' }}</span>
    </div>
    <div class="ps-meta-item">
      <span class="ps-meta-label">Numéro de contrat</span>
      <span class="ps-meta-value">{{ purchase.contract_awarding_id || '—' }}</span>
    </div>
  </div>
</div>
