<form novalidate [formGroup]="sheetSortForm">
    <div class="form-group row">
        <div class="col-9 col-sm-9"></div>
        <div class="col-3 col-sm-3" *ngIf="stateClosed==true">
            <button class="btn btn-sheet-search" (click)='changeState()'>Trier</button>
        </div>
        <div class="col-3 col-sm-3" *ngIf="stateClosed==false">
            <select class="form-control" name="sortBy" [formControl]="sortBy" class="form-control" id="sortBy" (change)="changeSort($event)">
                <option value="date_desc">Date (La plus récente)</option>
                <option value="date_asc">Date (La plus ancienne)</option>
                <option value="title_asc">Titre (croissant)</option>
                <option value="title_desc">Titre (décroissant)</option>
            </select>
        </div>
    </div>
    </form>
