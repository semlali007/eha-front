<div class="form-group">
    <label for="committeeCode"><strong>Catégorie Achats :</strong></label>
    <select class="form-control" [formControl]="categoryCode" style="width:auto;">
        <option value=0>Choisissez une catégorie</option>
        <option *ngFor="let item of categories" [ngValue]="item.code">
            {{item.label}}
        </option>
    </select>
</div>
