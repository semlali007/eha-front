<div class="form-group row">
    <div class="col-6 col-sm-7 offset-sm-1">
        <small class="form-text text-muted">Vous pouvez éventuellement limiter vos recherches à une ligne PGI :</small>
        <table>
            <tr>
                <td>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="radioSystem" value="" id="system0"
                            [formControl]="line">
                        <label class="form-check-label" for="system0">tous les mandants PGI</label>
                    </div>
                </td>
                <td *ngFor="let l of lineList">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="radioSystem" [value]="l.code" id="l.code"
                            [formControl]="line" [tooltip]="l.tooltip" placement="top">
                        <label class="form-check-label" for="l.code"> {{l.label}}</label>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</div>
