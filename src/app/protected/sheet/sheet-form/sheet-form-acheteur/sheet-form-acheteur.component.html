<div class="row">
  <div class="col-12">
    <div class="form-group">
      <label for="acheteur" class="form-label">
        Acheteur
      </label>
      <input
        type="text"
        class="form-control"
        id="acheteur"
        [formControl]="acheteur"
        placeholder="Saisir l'acheteur"
        maxlength="500"
      />
      <div 
        *ngIf="acheteur?.invalid && acheteur?.touched" 
        class="text-danger small mt-1">
        <div *ngIf="acheteur?.errors?.['maxlength']">
          L'acheteur ne peut pas dépasser 500 caractères
        </div>
      </div>
    </div>
  </div>
</div>
