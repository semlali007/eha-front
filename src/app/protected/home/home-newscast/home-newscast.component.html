<div class="hnc" *ngIf="(data$ | async) as data">
  <div class="hnc-panel" *ngIf="!!data && !!data.total && data.total > 0">

    <!-- ══ État grille ══ -->
    <ng-container *ngIf="!selected">
      <div class="hnc-head">
        <div class="hnc-head-left">
          <img src="assets/img/mdi_announcement.png" class="hnc-icon" alt="">
          <span class="hnc-head-title">Actualités</span>
        </div>
        <button type="button" class="hnc-all" (click)="navigateToList()">
          Consulter toute l'actualité
          <span class="hnc-all-arrow">&#8594;</span>
        </button>
      </div>

      <div class="hnc-grid">
        <article class="hnc-card" *ngFor="let news of data.data | slice:0:6" (click)="open(news)">
          <div class="hnc-card-top">
            <span class="badge hnc-badge {{ news.categ_code | newsCastCategoryColor }}">{{ news.categ }}</span>
            <span class="hnc-date">{{ news.published_date | customDate: "dd.MM.yyyy" }}</span>
          </div>
          <h3 class="hnc-card-title">{{ news.title }}</h3>
          <p class="hnc-card-desc" [innerHtml]="news.short_description | striphtml"></p>
          <span class="hnc-more">Lire la suite</span>
        </article>
      </div>
    </ng-container>

    <!-- ══ État détail (plein bloc) ══ -->
    <div class="hnc-detail" *ngIf="selected">
      <div class="hnc-detail-top">
        <span class="badge hnc-badge {{ selected.categ_code | newsCastCategoryColor }}">{{ selected.categ }}</span>
        <span class="hnc-date">Publié le {{ selected.published_date | customDate: "dd.MM.yyyy" }}</span>
        <button type="button" class="hnc-close" (click)="close()" aria-label="Fermer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </div>

      <h2 class="hnc-detail-title">{{ selected.title }}</h2>

      <div class="hnc-detail-body" [innerHtml]="selected.long_description || selected.short_description"></div>
    </div>

  </div>
</div>
