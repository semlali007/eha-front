<div class="form-group">
    <label class="label-with-icon">
        <strong>Zones :</strong><span class="required">*</span>
        <span class="info-icon"
            [tooltip]="geographicZoneTooltipTemplate"
            placement="top"
            container="body"
            role="img" 
            aria-label="Information"></span>
    </label>
    <div class="row">
        <div class="col-sm-10">
            <tag-input [formControl]="areas"  [placeholder]="''" [onTextChangeDebounce]="500"
                [secondaryPlaceholder]="''" [onlyFromAutocomplete]="true">
                <tag-input-dropdown [autocompleteObservable]="requestAutocompleteItems" [minimumTextLength]="3"
                    [identifyBy]="'code'" [displayBy]="'label'">
                </tag-input-dropdown>
            </tag-input>
        </div>
        <div class="col-sm-2">
            <button type="button" class="btn btn-edf"
            (click)="openModalWithComponent()"
               >Zones</button>
        </div>
    </div>
    <small *ngIf="areas.errors" class="form-text text-danger">
        <span [hidden]="!areas.errors.required">
            Zones requis.
        </span>
       
    </small>
</div>

<!-- Template pour le tooltip de zone géographique -->
<ng-template #geographicZoneTooltipTemplate>
    <div class="tooltip-content geographic-zone-tooltip">
        <div class="zone-options">
            <div class="zone-item">• France métropolitaine (hors Corse)</div>
            <div class="zone-item">• France métropolitaine + Corse</div>
            <div class="zone-item">• France métropolitaine + Corse + DROM</div>
            <div class="zone-item">• France et international</div>
        </div>
    </div>
</ng-template>
