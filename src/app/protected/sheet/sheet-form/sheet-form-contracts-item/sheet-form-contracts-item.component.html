<div [formGroup]="contract" class="form-group row">
    {{isActive}}
    <div class="col-2">
        <input [readonly]="!isActive" formControlName="code" type="text" class="form-control" [placeholder]="'Code contrat'">
    </div>
    <div class="col-2">
        <textarea [readonly]="!isActive" formControlName="provider" class="form-control" [placeholder]="'Fournisseur'"></textarea>
    </div>
    <div class="col-5">
        <editor *ngIf ="isActive" formControlName="contacts" id="contact{{index}}" [init]="{base_url: '/tinymce', suffix: '.min', language: 'fr_FR', plugins : 'advlist autolink link lists charmap print preview table',branding: false}"></editor>
        <div *ngIf ="!isActive" [innerHTML]="contract.value.contacts"></div>
    </div>

    <div class="col-2">
        <tag-input formControlName="lots" [onlyFromAutocomplete]="false" [placeholder]="'Entrer un lot'"
            [secondaryPlaceholder]="'Entrer un lot'" [onlyFromAutocomplete]="true">
            <tag-input-dropdown [showDropdownIfEmpty]="false" [dynamicUpdate]="false" [focusFirstElement]="false"
                [displayBy]="'name'" [identifyBy]="'name'" [autocompleteItems]="lotsListForContract">
                <ng-template let-item="item" let-index="index">
                    {{ item.name }}
                </ng-template>
            </tag-input-dropdown>
        </tag-input>
    </div>
    <div class="col">
        <div class="row">
            <button class="remove col" (click)="confirmation(template)" type="button">-</button>
            <button class="edit col" (click)="changeState(index)" type="button"><i>&#9998;</i></button>
        </div> 
    </div>

</div>

<br><br>
<ng-template #template>
  <div class="modal-body text-center">
    <p>Voulez-vous confirmer la suppression ?</p>
    <button type="button" class="btn btn-default" (click)="confirm()">Oui</button>
    <button type="button" class="btn btn-primary" (click)="decline()">Non</button>
  </div>
</ng-template>
