<div class="adm-form-group">
  <label for="supplierVatNumber" class="adm-label">
    Numéro TVA intracommunautaire ou DUNS
  </label>
  <input id="supplierVatNumber"
         [formControl]="supplierVatNumber"
         type="text"
         class="adm-input"
         placeholder="Ex : FR12345678901"
         autocorrect="off"
         autocomplete="off">
  <span class="adm-field-hint">
    Numéro TVA pour les fournisseurs UE, ou DUNS pour les fournisseurs hors UE.
  </span>
  <span *ngIf="supplierVatNumber.errors && supplierVatNumber.touched" class="adm-field-error">
    <ng-container *ngIf="supplierVatNumber.errors.required">Numéro TVA intracommunautaire requis.</ng-container>
    <ng-container *ngIf="supplierVatNumber.errors.pattern">Format de numéro TVA invalide.</ng-container>
  </span>
</div>
