<header class="my-header" role="banner">
  <div class="container-fluid">
    <div class="row align-items-center">
       
      <div class="col-12 col-sm-12">
        <table width="96%" border="0">
          <tr>
            <td style="width:13%">
              <a  (click)="navigate(homePath)"><img src="../../../../assets/img/logo-edf-blanc.png" class="my-logo link"></a>
            </td>
            <td><b>Achatpédia</b>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<small>Votre espace de documentation, de recherche, et de contacts sur les achats</small></td>
            <td *ngIf="user" ><a (click)="logout()" type="button"><img class="logout-icon" src="../../../../assets/img/se_deconnecter.png">&nbsp;Se déconnecter</a>
              <img class="mt-1" src="../../../../assets/img/info-icon-green.png" style="width: 20px;margin-left: 5px;color:RGB(80,158,47) ;padding-bottom: 11px !important;" /> <span *ngIf="(notification$ | async) as notification" (click)="openModal()" style="color:RGB(80,158,47)">  {{ notification.count }}</span>
          </td>
          </tr>
        </table>
        
      </div>
    </div>
  </div>
</header>
