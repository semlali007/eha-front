<app-purchase-situation-no-result [purchases]="purchases" [params]="params"></app-purchase-situation-no-result>

<accordion *ngIf="purchases.length > 0" class="ps-accordion">
  <accordion-group #group *ngFor="let item of purchases | slice:startItem:endItem; index as i" [isOpen]="isOpen" panelClass="customClass" (isOpenChange)="loadItem($event, item)">
    <app-purchase-situation-list-item-header [item]="item" [slicedLabel]="item.need_mtb_desc | striphtml" [isOpened]="opened[item.need_system_id]" accordion-heading panelClass="customClass">
    </app-purchase-situation-list-item-header>
    <app-purchase-situation-list-item-body [purchase$]="data[item.need_system_id]" [purchase]="item">
    </app-purchase-situation-list-item-body>
  </accordion-group>
</accordion>

<div class="adm-pagination-bar" *ngIf="purchases.length > itemsPerPage">
  <p class="adm-pagination-info">
    Affichage {{ startItem + 1 }} – {{ endItem > purchases.length ? purchases.length : endItem }} sur {{ purchases.length }} demandes
  </p>
  <form [formGroup]="paginationForm" class="adm-pagination-wrap">
    <pagination
      [totalItems]="purchases.length"
      [itemsPerPage]="itemsPerPage"
      [formControl]="currentPage"
      (pageChanged)="pageChanged($event)"
      [maxSize]="7"
      previousText="&lsaquo;"
      nextText="&rsaquo;"
      firstText="&laquo;"
      lastText="&raquo;">
    </pagination>
  </form>
</div>
