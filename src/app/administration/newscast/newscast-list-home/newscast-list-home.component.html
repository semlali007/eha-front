<div class="container-fluid">
  <div class="row ">
    <div class="col-md-9" style="margin-top:-8px;">
      <div class="row justify-content-center">
        <div class="col-12">
          <div class="col-12">
            <div class="row">
              <div class="col-lg-12">
                <div class="form-group row">
                  <div class="col-9 col-sm-9"></div>
                  <div class="col-3 col-sm-3"
                    *ngIf="!!user && (user.hasRole('EHA_ADMIN') || user.hasRole('EHA_GESTIONNAIRE'))">
                    <a (click)="navigate('creation')" class="btn btn-sheet-search"><i class="fas fa-plus"></i>
                      Ajouter une actualité</a>
                  </div>
                </div>
              </div>
            </div>
            <div>
              <div>
                <div class="tab-content">
                  <div class="active">
                    <div>
                      <div class="list-group my-items-for-trainings" *ngIf="newsList">
                        <app-newscast-list-home-item *ngFor="let news of newsList" [news]="news">
                        </app-newscast-list-home-item>
                        <div class="row">
                          <form class="col-xs-12 col-12" [formGroup]="paginationForm">
                            <nav aria-label="pagination">
                              <pagination [boundaryLinks]="true" [totalItems]="totalItems" [itemsPerPage]="itemsPerPage"
                                [formControl]="currentPage" (pageChanged)="pageChanged($event)" [maxSize]="10"
                                (numPages)="smallnumPages = $event" previousText="&lsaquo;" nextText="&rsaquo;"
                                firstText="&laquo;" lastText="&raquo;">
                              </pagination>
                            </nav>
                          </form>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
