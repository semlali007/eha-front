<div class="list-group card" style="width: 18rem;">
    <button class="list-group-item filter-header smaller-text" (click)="isTotalCollapsed = !isTotalCollapsed"
    [attr.aria-expanded]="!isTotalCollapsed" aria-controls="miseAJourDonneeList">
        Mise à jour de la donnée <i class="fleche fleche-droite" [class.fleche-bas]="isTotalCollapsed == false"></i>
    </button>
    <div id="miseAJourDonneeList" [collapse]="isTotalCollapsed" [isAnimated]="true">
    <div class="list-group list-group-flush">        
        <button class="list-group-item list-group-item-action" *ngIf="miseAJourDonnee && miseAJourDonnee.value!='all'" 
        (click)="changeFilter('all')"
        [class.list-group-item-success]="isActive('all')" [attr.aria-pressed]="isActive('all')">
            Tous
        </button>
        <button class="list-group-item list-group-item-action"
         *ngFor="let item of list" 
        (click)="changeFilter(item.code)"
        [class.list-group-item-success]="isActive(item.code)" [attr.aria-pressed]="isActive(item.code)">
            <span>{{item.label}}</span> ({{item.count}})
        </button>
        <!-- Debug: Afficher si la liste est vide -->
        <div *ngIf="!list || list.length === 0" class="list-group-item">
            Chargement... (Debug: list={{list | json}})
        </div>
    </div>
    </div>
  </div>
