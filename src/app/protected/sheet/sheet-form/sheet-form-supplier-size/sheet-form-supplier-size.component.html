<div class="adm-form-group" *ngIf="supplierSize">
  <label for="supplier_size" class="adm-label">Taille du fournisseur</label>
  <select id="supplier_size" [formControl]="supplierSize" class="adm-select">
    <option value="">— Sélectionner —</option>
    <option *ngFor="let s of supplierSizes" [value]="s.id">{{ s.name }}</option>
  </select>
  <span class="adm-field-hint">
    <strong>PME</strong> : Petites et moyennes entreprises ·
    <strong>ETI</strong> : Entreprise de taille intermédiaire (250–4999 salariés, CA ≤ 1,5 Md€ ou bilan ≤ 2 Md€) ·
    <strong>GE</strong> : Grandes entreprises.
  </span>
</div>
