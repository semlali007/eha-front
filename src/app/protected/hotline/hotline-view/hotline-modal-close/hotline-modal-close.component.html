<div class="modal-content">
    <div class="modal-header">
        <h5 class="modal-title">La réponse vous satisfait-elle ?</h5>
        <button type="button" class="close" (click)="bsModalRef.hide()" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <form [formGroup]="closeForm" (ngSubmit)="submit()">
            <div class="col-12">
                <div class="form-group">
                    <span class="form-help">&nbsp;<br>Vous pouvez nous laisser un retour ci-dessous avant d'appuyer
                        sur le bouton valider, merci.</span>
                    <textarea class="form-control" rows="2" [formControl]="message" placeholder=" Super !"></textarea>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-primary" [disabled]="!closeForm.valid" (click)="submit()">Valider</button>
        <button type="button" class="btn btn-secondary" (click)="bsModalRef.hide()">Annuler</button>
    </div>
</div>
