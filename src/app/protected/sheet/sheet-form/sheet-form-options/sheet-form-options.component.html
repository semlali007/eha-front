<div [formGroup]="sheetForm">
  <label for="lots"><strong>Options :</strong></label>
  <div formArrayName="options">
    <app-sheet-form-options-item *ngFor="let option of options.controls; index as i; first as isFirst; last as isLast;"
      [index]="i" [isFirst]="isFirst" [isLast]="isLast" [option]="option" (removedTask)="onRemovedTask($event)">

    </app-sheet-form-options-item>
  </div>
  <div >
    
    <app-sheet-form-options-add *ngIf="options.controls.length < 6" (addedTask)="onAddedTask()">
    </app-sheet-form-options-add>
  </div>
</div>
