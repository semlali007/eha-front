<div class="adm-form-group">
  <label for="title" class="adm-label">
    Nom de la fiche<span class="adm-required">*</span>
  </label>
  <input id="title"
         [formControl]="title"
         type="text"
         class="adm-input"
         placeholder="Ex : Accord-cadre fournitures de bureau"
         autocorrect="off"
         autocomplete="off">
  <span class="adm-field-hint">L'objet de la fiche (3 lignes maximum en cas d'objet long).</span>
  <span *ngIf="title.errors && title.touched" class="adm-field-error">
    <ng-container *ngIf="title.errors.required">Titre requis.</ng-container>
    <ng-container *ngIf="title.errors.minlength">Le titre doit faire au moins 4 caractères.</ng-container>
  </span>
</div>
