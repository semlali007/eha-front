<div class="adm-form-group">
  <label for="committeeCode" class="adm-label">Comité de gestion de la demande</label>
  <select id="committeeCode" class="adm-select" [formControl]="committeeCode">
    <option [ngValue]="0">Choisissez un comité</option>
    <option *ngFor="let item of committees" [ngValue]="item.code">{{ item.label }}</option>
  </select>
</div>
