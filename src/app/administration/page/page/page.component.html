<div class="adm-page">

  <div class="adm-header">
    <h1 class="adm-title">{{ staticPage?.title || 'Page' }}</h1>
    <div class="adm-header-actions" *ngIf="saved">
      <span class="adm-chip adm-chip--green">
        <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" fill="currentColor" viewBox="0 0 16 16">
          <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
        </svg>
        Enregistré
      </span>
    </div>
  </div>

  <form [formGroup]="pageForm" (ngSubmit)="submit()">

    <section class="adm-section">
      <div class="adm-section-head">
        <span class="adm-section-number">1</span>
        <div class="adm-section-titles">
          <h3 class="adm-section-title">Contenu de la page</h3>
          <p class="adm-section-sub">Texte affiché aux utilisateurs (HTML autorisé)</p>
        </div>
      </div>
      <div class="adm-form-group">
        <label class="adm-label">
          Contenu<span class="adm-required">*</span>
        </label>
        <div class="adm-editor-wrap">
          <editor id="content" formControlName="content"
                  [init]="{base_url: '/tinymce', suffix: '.min', language: 'fr_FR', plugins: 'advlist lists preview link', branding: false, menubar: false, height: 360}">
          </editor>
        </div>
        <span *ngIf="content?.errors?.required && content?.dirty" class="adm-field-error">Contenu requis.</span>
      </div>
    </section>

    <section class="adm-section">
      <div class="adm-section-head">
        <span class="adm-section-number">2</span>
        <div class="adm-section-titles">
          <h3 class="adm-section-title">Visibilité</h3>
          <p class="adm-section-sub">Activer ou désactiver l'affichage de la page</p>
        </div>
      </div>
      <div class="adm-form-group">
        <label class="adm-switch">
          <input type="checkbox" formControlName="active">
          <span class="adm-switch-track"></span>
          <span class="adm-switch-label">Page active</span>
        </label>
        <span class="adm-field-hint">Une page inactive ne s'affichera pas côté utilisateur.</span>
      </div>
    </section>

    <div style="display: flex; justify-content: flex-end; margin-top: 20px">
      <button type="submit" [disabled]="!pageForm.valid" class="adm-btn adm-btn-edf">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
        </svg>
        Enregistrer
      </button>
    </div>
  </form>
</div>
