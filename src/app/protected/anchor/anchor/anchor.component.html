<div class="anc-page">
  <app-breadcrumb></app-breadcrumb>

  <!-- En-tête -->
  <header class="anc-header">
    <span class="anc-header-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/>
      </svg>
    </span>
    <div>
      <h1 class="anc-header-title">Ancrage territorial</h1>
      <p class="anc-header-sub">
        Recherchez les fournisseurs proches d'un code postal et affinez par codes NACE ou codes articles.
      </p>
    </div>
  </header>

  <!-- Formulaire de recherche -->
  <div class="anc-card">
    <app-anchor-form (submittedSearchAnchor)="onSubmittedSearchAnchor($event)"></app-anchor-form>
  </div>

  <!-- Récapitulatif + nombre par page -->
  <div class="anc-card anc-summary">
    <div class="anc-summary-text">
      <app-anchor-result-search-params [anchor]="anchor" [filter]="filter"></app-anchor-result-search-params>
    </div>
    <div class="anc-perpage">
      <span class="anc-perpage-label">Fournisseurs par page</span>
      <div class="btn-group" dropdown>
        <button id="button-basic" dropdownToggle type="button"
          class="btn anc-perpage-btn dropdown-toggle" aria-controls="dropdown-basic">
          {{ itemsPerPage }} <span class="caret"></span>
        </button>
        <ul id="dropdown-basic" *dropdownMenu class="dropdown-menu dropdown-menu-right" role="menu"
          aria-labelledby="button-basic">
          <li role="menuitem"><a class="dropdown-item" (click)="changePerPage(10)">10</a></li>
          <li role="menuitem"><a class="dropdown-item" (click)="changePerPage(20)">20</a></li>
          <li role="menuitem"><a class="dropdown-item" (click)="changePerPage(30)">30</a></li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Résultats : deux colonnes -->
  <div class="anc-results" *ngIf="!!anchor.activeProviders || !!anchor.notActiveProviders">
    <app-anchor-result-search-active class="anc-col"
      [activeProviders]="anchor.activeProviders" [itemsPerPage]="itemsPerPage">
    </app-anchor-result-search-active>

    <app-anchor-result-search-not-active class="anc-col"
      [notActiveProviders]="anchor.notActiveProviders" [itemsPerPage]="itemsPerPage">
    </app-anchor-result-search-not-active>
  </div>
</div>
