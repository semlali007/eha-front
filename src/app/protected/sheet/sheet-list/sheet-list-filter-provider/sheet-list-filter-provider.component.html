<ng-template #customItemTemplate let-model="item">
    {{model.name}} ({{ model.count }})
  </ng-template>

<div class="list-group card" style="width: 18rem" *ngIf="list.length > 0">
    <button class="list-group-item filter-header smaller-text" (click)="isTotalCollapsed = !isTotalCollapsed"
    [attr.aria-expanded]="!isTotalCollapsed" aria-controls="providerList">
        Fournisseurs <i class="fleche fleche-droite" [class.fleche-bas]="isTotalCollapsed == false"></i>
    </button>
    <div id="providerList" [collapse]="isTotalCollapsed" [isAnimated]="true">
        <form [formGroup]="myForm">
            <input formControlName="state"
                [(ngModel)]="selected"
                [typeahead]="list"
                [typeaheadOptionsLimit]="7"
                [typeaheadMinLength]="0"
                typeaheadOptionField="name"
                (typeaheadOnSelect)="onSelect($event)"
                [typeaheadItemTemplate]="customItemTemplate"
                placeholder="Entrer un fournisseur"
                class="form-control">
        </form>    
        <ul class="list-group list-group-flush">
            <li class="list-group-item" *ngFor='let item of providers.value' >
                {{item.name}} ({{item.count}})<i style="float: right; cursor:pointer" (click)="deleteOneProvider(item.code)" >&#10005;</i>
            </li>
        </ul>
    </div>
</div>
