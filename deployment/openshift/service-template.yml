####
#
# Openshift template.
#
# Use it with oc process, passing parameters using '-p' options, it will generate a BuildConfig that you can apply.
#
# Parameters are listed at the end of this file.
#
####
---
apiVersion: template.openshift.io/v1
kind: Template
labels:
  build-template: devops_openshift-simple-deploy-template-service
message: "Simple Deploy template for EDF's DevOps / CaaS integration devops_openshift-simple-deploy-template"
metadata:
  annotations:
    description: "Simple Deploy template for EDF's DevOps / CaaS integration devops_openshift-simple-deploy-template"
  creationTimestamp: null
  name: devops_openshift-simple-deploy-template
objects:
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: app-${APPLICATION_NAME}-${ENV}-${VERSION}
      name: app-${APPLICATION_NAME}-${ENV}-${VERSION}
    spec:
      ports:
        - name: 3000-tcp
          port: 3000
          protocol: TCP
          targetPort: 3000
        - name: 6042-tcp
          port: 6042
          protocol: TCP
          targetPort: 6042          
      selector:
        app: app-${APPLICATION_NAME}-${ENV}-${VERSION}
      sessionAffinity: None
      type: ClusterIP
    status:
      loadBalancer: {}
parameters:
  - name: APPLICATION_NAME
    required: true
  - name: VERSION
    required: true
  - name: ENV
    required: true    

