    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">Partager cette discussion</h5>
            <button type="button" class="close"  aria-label="Close" (click)="bsModalRef.hide()">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body">
            <form novalidate [formGroup]="hotlineForwardForm" (ngSubmit)="submit()">
                <div class="form-group">
                    <label>Email de la personne avec qui partager</label>
                    <input type="email" class="form-control" placeholder="email"  [formControl]="email" >
                    <small *ngIf="email.errors && email.dirty" class="form-text text-muted">
                        <span [hidden]="!email.errors.email">Entrez une adresse email valide.</span>
                      </small>
                      <label>Email de la personne à mettre en copie (facultatif)</label>
                    <input type="email" class="form-control" placeholder="email"  [formControl]="emailcc" >
                    <small *ngIf="email.errors && email.dirty" class="form-text text-muted">
                        <span [hidden]="!email.errors.email">Entrez une adresse email valide.</span>
                      </small>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-primary" (click)="submit()" [disabled]="!hotlineForwardForm.valid">Valider</button>
            <button type="button" class="btn btn-secondary" (click)="bsModalRef.hide()">Annuler</button>
        </div>
    </div>
