<div [formGroup]="contract" class="form-group row">
    <table class="table table-striped table-hover" style="background-color: #59a1a079;">
        <tbody [ngClass]="{'bg-light text-dark': !isActive, 'bg-white text-black': isActive}">
            <tr>
                <td>
                    <input [readonly]="!isActive" formControlName="code" type="text" class="form-control border-0" [placeholder]="'Code contrat'">
                    <div class="spinner-border text-primary" role="status" *ngIf="code.pending">
                        <span class="sr-only">Loading...</span>
                    </div>
                    <small *ngIf="code.errors && isActive" class="form-text text-danger">
                        <span [hidden]="!code.errors.required">- Code requis.<br></span>
                        <span [hidden]="!code.errors.minlength">- Le code doit faire plus de 9 caractères.<br></span>
                        <span [hidden]="!code.errors.maxlength">- Le code doit faire moins de 10 caractères.<br></span>
                        <span [hidden]="!code.errors.pattern">- Le code doit commencer par un 'C'.<br></span>
                        <span [hidden]="!code?.errors?.invalidContractCode">- Le code n'existe pas.<br></span>
                    </small>
                    <small *ngIf="!code.errors && isActive && !code.pending" class="form-text text-success">
                        <span [hidden]="!!code?.errors">- Votre code contrat est valide.<br></span>
                    </small>
                </td>
                <td>
                    <textarea [readonly]="!isActive" formControlName="provider" class="form-control border-0" style="max-height: 400px; width: 250px; " [placeholder]="'Fournisseur'"></textarea>
                </td>
                <td>
                    <textarea [readonly]="!isActive" formControlName="contacts" class="form-control border-0" style="max-height: 400px; width: 350px; " [placeholder]="'Contacts'"></textarea>
                </td>
                <td>
                    <input [readonly]="!isActive" formControlName="lots" class="form-control border-0" style="width: 100px;" [placeholder]="'lots'">
                </td>
                <td>
                    <button class="remove" style="width: 40px; height: 40px; padding: 5;" (click)="confirmation(template)" type="button">-</button>
                    <button class="edit" style="width: 40px; height: 40px; padding: 5;" (click)="changeState(index)" type="button"><i>&#9998;</i></button>
                </td>
            </tr>
        </tbody>
    </table>
    <br><br>
    <ng-template #template>
        <div class="modal-body text-center">
            <p>Voulez-vous confirmer la suppression ?</p>
            <button type="button" class="btn btn-default" (click)="confirm()">Oui</button>
            <button type="button" class="btn btn-primary" (click)="decline()">Non</button>
        </div>
    </ng-template>
</div>
