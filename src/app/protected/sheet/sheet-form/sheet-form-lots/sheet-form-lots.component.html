<div [formGroup]="sheetForm" class="adm-form-group">
  <label class="adm-label">Lots</label>

  <div formArrayName="lots" class="adm-array-list">
    <app-sheet-form-lots-item *ngFor="let lot of lots.controls; index as i;"
                               [index]="i"
                               [lot]="lot"
                               (removedLot)="onRemovedLot($event)">
    </app-sheet-form-lots-item>

    <div *ngIf="lots.controls.length === 0" class="adm-array-empty">
      Aucun lot défini.
    </div>
  </div>

  <div class="adm-array-add">
    <app-sheet-form-lots-add (addedLot)="onAddedLot()"></app-sheet-form-lots-add>
  </div>
</div>
