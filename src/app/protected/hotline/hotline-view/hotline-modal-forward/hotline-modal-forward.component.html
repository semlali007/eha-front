<div class="modal-content">
  <div class="adm-modal-header">
    <h4 class="adm-modal-title">Partager cette discussion</h4>
    <button type="button" class="adm-modal-close" aria-label="Fermer" (click)="bsModalRef.hide()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
        <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854z"/>
      </svg>
    </button>
  </div>

  <div class="adm-modal-body">
    <form novalidate [formGroup]="hotlineForwardForm" (ngSubmit)="submit()">
      <div class="adm-form-group">
        <label class="adm-label" for="hl-fwd-email">Email du destinataire<span class="adm-required">*</span></label>
        <input id="hl-fwd-email" type="email" class="adm-input" placeholder="prenom.nom@edf.fr" [formControl]="email">
        <span class="adm-field-error" *ngIf="email.errors?.email && email.dirty">Entrez une adresse email valide.</span>
      </div>

      <div class="adm-form-group">
        <label class="adm-label" for="hl-fwd-cc">Email en copie <span class="adm-field-hint" style="font-weight:normal">(facultatif)</span></label>
        <input id="hl-fwd-cc" type="email" class="adm-input" placeholder="prenom.nom@edf.fr" [formControl]="emailcc">
        <span class="adm-field-error" *ngIf="emailcc.errors?.email && emailcc.dirty">Entrez une adresse email valide.</span>
      </div>

      <div class="adm-form-group">
        <label class="adm-label" for="hl-fwd-comment">Commentaires</label>
        <textarea id="hl-fwd-comment" class="adm-textarea" rows="3" placeholder="Votre commentaire…" [formControl]="commentaire"></textarea>
      </div>
    </form>
  </div>

  <div class="adm-modal-footer">
    <button type="button" class="adm-btn adm-btn-ghost" (click)="bsModalRef.hide()">Annuler</button>
    <button type="button" class="adm-btn adm-btn-edf" (click)="submit()" [disabled]="!hotlineForwardForm.valid">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
      </svg>
      Valider
    </button>
  </div>
</div>
