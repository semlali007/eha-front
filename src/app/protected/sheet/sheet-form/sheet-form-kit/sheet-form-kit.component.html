<div class="adm-form-group">
  <label class="adm-label" for="upload">{{ label }}</label>

  <label for="upload" class="adm-dropzone">
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l-3 3m3-3l3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/>
    </svg>
    <div class="adm-dropzone-text">
      <strong>Déposez vos fichiers ici</strong> ou cliquez pour parcourir
    </div>
    <div class="adm-dropzone-sub">PDF, Word, Excel, PowerPoint — 15 Mo max</div>
    <input (change)="upload()" id="upload" type="file" ng2FileSelect [uploader]="uploader" multiple hidden>
  </label>

  <div class="adm-file-list" *ngIf="uploader?.queue?.length">
    <div class="adm-file-item" *ngFor="let item of uploader.queue">
      <svg class="adm-file-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m.75 12l2.25 2.25L15 12m-3-9H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
      </svg>
      <div class="adm-file-meta">
        <span class="adm-file-name"
              *ngIf="!item.options || !item.options.additionalParameter || !item.options.additionalParameter.document">
          {{ item?.file?.name }}
        </span>
        <a class="adm-file-name adm-file-link"
           *ngIf="!!item.options && !!item.options.additionalParameter && !!item.options.additionalParameter.document"
           (click)="download(item?.options?.additionalParameter?.document)">
          {{ item?.file?.name }}
        </a>
      </div>
      <button type="button" class="adm-btn adm-btn-danger adm-btn-sm" (click)="item.remove(); onRemove(item);">
        Supprimer
      </button>
    </div>
  </div>
</div>

<ng-template #template>
  <div class="adm-modal-body" style="text-align:center">
    <p style="margin: 0 0 14px 0; font-weight: 600; color: #1f2937">
      Le fichier est trop volumineux. La taille maximale autorisée est de 10 Mo.
    </p>
    <div style="display: flex; justify-content: center">
      <button type="button" class="adm-btn adm-btn-edf" (click)="confirm()">OK</button>
    </div>
  </div>
</ng-template>

<ng-template #templateType>
  <div class="adm-modal-body" style="text-align:center">
    <p style="margin: 0 0 14px 0; font-weight: 600; color: #1f2937">
      Extensions autorisées : PDF, Word, Excel, PowerPoint.
    </p>
    <div style="display: flex; justify-content: center">
      <button type="button" class="adm-btn adm-btn-edf" (click)="confirm()">OK</button>
    </div>
  </div>
</ng-template>
