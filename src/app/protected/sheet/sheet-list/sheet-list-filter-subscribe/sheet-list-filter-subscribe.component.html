<div class="list-group card">
  <div class="list-group list-group-flush">
    <button type="button" class="list-group-item list-group-item-action"
      (click)="changeFilter()"
      [class.list-group-item-success]="isActive()"
      [attr.aria-pressed]="isActive()">
      <span class="filter-header-label">Mes abonnements ({{ list['count'] }}) <span class="filter-active-badge" *ngIf="isActive()">1</span></span>
    </button>
  </div>
</div>
