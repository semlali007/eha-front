<div class="list-group cadre">
    <p class="titre-cadre"><img src="../../../../assets/img/icon-search.png"> Rechercher</p>
    <p class="p">
        Recherchez un contrat, un fournisseur, un code article générique ou encore un produit :
    </p>
    <div class="row">
        <div class="col-8">
            <input type="search" class="form-control input-edf"  
                placeholder="Saisissez votre recherche" >
        </div>
        <div class="col-4">
            <button type="submit" class="btn btn-edf-v2" >Valider</button>
        </div>
    </div>
    <p class="p">
        Recherchez des fournisseurs près de chez vous (Code Postal) : 
    </p>
    <div class="row">
        <div class="col-8">
            <input type="search" class="form-control input-edf"  
                placeholder="Saisissez un Code Postal" >
        </div>
        <div class="col-4">
            <button type="submit" class="btn btn-edf-v2" >Valider</button>
        </div>
    </div>
    
</div>
