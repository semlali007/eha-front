<form novalidate [formGroup]="searchForm" (ngSubmit)="submit()" class="search-form">
  <label class="search-form-label" for="search-input">Saisissez un ou plusieurs mots clés</label>

  <div class="search-form-row">
    <app-search-form-words [words]="words"></app-search-form-words>
    <button class="search-form-btn" type="submit" [disabled]="!searchForm.valid">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
      </svg>
      Rechercher
    </button>
    <app-search-form-sample (resetedSearchForm)="onrResetedSearchForm()" [words]="words"></app-search-form-sample>
  </div>

  <p class="search-form-help">
    Vous pouvez effectuer une recherche par mots clés (ex&nbsp;: <code>contrat événementiel</code>) ou en langage naturel
    (ex&nbsp;: <code>je cherche un contrat pour de l'événementiel</code>).
    <br>
    Pour exclure un mot, préfixez-le du signe moins (ex&nbsp;: <code>-extracteur</code>).
  </p>

  <app-search-form-line [line]="line" (changedSystemForm)="onrChangedSystemForm()"></app-search-form-line>
</form>
