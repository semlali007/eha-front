<div class="form-group">
    <label for="title" class="label-with-icon">
        <strong>Nom fiche :</strong><span class="required">*</span>
        <span class="info-icon"
            tooltip="L'objet de la fiche (se limiter à 3 lignes maximum en cas d'objet long)"
            placement="top" role="img" aria-label="Information"></span>
    </label>
    <input id="title" [formControl]="title" type="title" class="form-control" placeholder="Le titre" autocorrect="off"
        autocomplete="off" />
    <small *ngIf="title.errors" class="form-text text-danger">
        <span [hidden]="!title.errors.required">
            Titre requis.
        </span>
        <span [hidden]="!title.errors.minlength">
            Titre doit faire plus de 4 caractères.
        </span>
    </small>
</div>
