<form class="anc-form" [formGroup]="anchorForm" (ngSubmit)="submit()">
  <div class="anc-form-grid">
    <div class="anc-field">
      <label class="anc-label">Codes / libellés NACE</label>
      <div class="anc-field-row">
        <tag-input formControlName="nace" class="anc-tag-input"
          [onlyFromAutocomplete]="false" [placeholder]="' '" [secondaryPlaceholder]="'0111, …, 9900'">
          <tag-input-dropdown [showDropdownIfEmpty]="false" [dynamicUpdate]="false" [focusFirstElement]="false"
            [displayBy]="'code'" [identifyBy]="'code'" [autocompleteItems]="codes">
            <ng-template let-item="item" let-index="index" class="list-group">
              <b>{{ item.code }}</b> {{ item.name }}
            </ng-template>
          </tag-input-dropdown>
        </tag-input>
        <button class="btn btn-outline-secondary anc-btn-codes" data-toggle="modal" type="button" (click)="openModalCodes()">
          codes/libellés
        </button>
      </div>
    </div>

    <div class="anc-field">
      <label class="anc-label">Codes articles</label>
      <input type="text" class="form-control anc-input" placeholder="1060000100, …, 1060000678"
        [formControl]="codeArticle" autocorrect="off">
    </div>
  </div>

  <div class="anc-form-actions">
    <button type="button" class="btn btn-link anc-btn-reset" (click)="resetForm()">Réinitialiser</button>
    <button type="submit" class="btn btn-primary anc-btn-apply">appliquer</button>
  </div>
</form>
