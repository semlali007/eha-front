<div class="adm-modal-header">
  <h4 class="adm-modal-title">{{ id ? 'Modifier la fiche' : 'Ajouter une fiche' }}</h4>
  <button type="button" class="adm-modal-close" aria-label="Fermer" (click)="bsModalRef.hide()">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
      <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854z"/>
    </svg>
  </button>
</div>

<form novalidate (ngSubmit)="submit()" [formGroup]="factsheetAddForm">
  <div class="adm-modal-body">

    <div class="adm-form-group">
      <label for="fact-title" class="adm-label">
        Titre<span class="adm-required">*</span>
      </label>
      <input id="fact-title"
             class="adm-input"
             type="text"
             [formControl]="$any(title)"
             placeholder="Le titre de la fiche"
             autocorrect="off"
             autocomplete="off">
    </div>

    <div class="adm-form-group">
      <label class="adm-label">
        Fichier<span class="adm-required">*</span>
      </label>
      <div class="adm-file-picker">
        <label class="adm-btn adm-btn-ghost adm-file-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l-3 3m3-3l3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/>
          </svg>
          <span>Choisir un fichier</span>
          <input type="file" [formControl]="$any(file)" (change)="onFileChange($event)">
        </label>
        <span class="adm-file-name" *ngIf="fileName">{{ fileName }}</span>
        <span class="adm-file-name adm-file-name--empty" *ngIf="!fileName">Aucun fichier sélectionné</span>
      </div>
      <span *ngIf="file?.errors?.required && file?.dirty" class="adm-field-error">
        Le fichier est obligatoire.
      </span>
    </div>

  </div>

  <div class="adm-modal-footer">
    <button type="button" class="adm-btn adm-btn-ghost" (click)="bsModalRef.hide()">Annuler</button>
    <button type="submit" class="adm-btn adm-btn-edf" [disabled]="!factsheetAddForm.valid">
      {{ id ? 'Enregistrer' : 'Ajouter' }}
    </button>
  </div>
</form>
