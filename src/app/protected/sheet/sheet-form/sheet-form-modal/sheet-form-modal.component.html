<div class="modal-header">
    <h4 class="modal-title pull-left">{{title}}</h4>
    <button type="button" class="close pull-right" aria-label="Close" (click)="bsModalRef.hide()">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body">
    <div class="row justify-content-center">
        <div class="col-11">
            <div class="row" *ngIf="type != 'domain' && type!='subdomain'">
                <div class="col-lg-12">
                    <form novalidate [formGroup]="sheetModalForm" (ngSubmit)="submit()">
                        <div class="form-group row">

                            <div class="col-6 col-sm-7">
                                <input id="title" [formControl]="newItem" type="title" class="form-control" placeholder="Le titre" autocorrect="off" 
        autocomplete="off"
                [typeahead]="names"
                [typeaheadOptionsLimit]="7"
                [typeaheadMinLength]="2"
                (typeaheadOnSelect)="onSelect($event)"
                 />

                            </div>
                            <div class="col-4 col-sm-4">
                                <button type="submit" name="submit" class="btn btn-edf" >Ajouter</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div>
                <div>
                    <div class="tab-content">
                        <div class="active">
                            <div>
                                <div class="list-group my-items-for-trainings">
                                    <div class="list-group-item" *ngFor="let item of items">
                                        <div>
                                            <strong>{{ item.label }}</strong>
                                            <span style="float:right">
                                                <button type="button" class="btn btn-danger float-left initial" *ngIf="type == 'provider' || type=='beneficiary'"(click)="remove(item)" >
                                                    Supprimer
                                                </button></span>
                                                <span>&nbsp;</span>
                                                <span style="float:right"> <button
                                                    class="btn btn-edf" (click)="addItemToList(item)" *ngIf="!isSelected(item)">Sélectionner</button>
                                            </span>
                                                <span style="float:right"> <button
                                                class="btn btn-edf" (click)="removeItemFromList(item.code)" *ngIf="isSelected(item)">Retirer</button>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <form class="col-xs-12 col-12" [formGroup]="sheetModalForm">
                                  <pagination [boundaryLinks]="true" [totalItems]="total" [itemsPerPage]="itemsPerPage" (numPages)="smallnumPages = $event" [formControl]="currentPage"
                                    (pageChanged)="pageChanged($event)"  previousText="&lsaquo;" [maxSize]="maxSize"
                                    nextText="&rsaquo;" firstText="&laquo;" lastText="&raquo;">
                                  </pagination>
                                </form>
                              </div>
                        </div>
                    </div>
                </div>
            </div>
            <div>
                <nav class="d-flex justify-content-center">
                    <div class="bs-component">
                        <tag-input [formControl]="selectedItems" [placeholder]="''" [onTextChangeDebounce]="500"
                            [secondaryPlaceholder]="''" [onlyFromAutocomplete]="true">
                            <tag-input-dropdown [autocompleteObservable]="requestAutocompleteItems" [minimumTextLength]="3"
                                [identifyBy]="'code'" [displayBy]="'label'"    [zIndex]="1099">
                            </tag-input-dropdown>
                        </tag-input>
                    </div>
                </nav>
            </div>
        </div>
    </div>
    <br>
</div>
<div class="modal-footer">
    <button class="btn btn-success" type="button" (click)="validateModal()">Enregistrer</button>
    <button class="btn btn-danger" type="button" (click)="bsModalRef.hide()">Annuler</button>

</div>


<div *ngIf="isModalShown" [config]="{ show: true }" (onHidden)="onHidden()" bsModal #autoShownModal="bs-modal"
    class="modal fade" tabindex="-1" role="dialog" aria-labelledby="dialog-auto-name">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-body text-center">
                <p>{{modalMessage}}</p>
                <button type="button" class="btn btn-default" (click)="confirm()">Oui</button>
                <button type="button" class="btn btn-primary" (click)="decline()">Non</button>
            </div>
        </div>
    </div>
</div>
