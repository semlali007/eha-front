<div class="card" style="width: 18rem" *ngIf="list.length > 0">
    <div class="card-header link smaller-text" (click)="isTotalCollapsed = !isTotalCollapsed"
    [attr.aria-expanded]="!isTotalCollapsed" aria-controls="collapseTotal">
        Fournisseurs <i class="fleche fleche-droite" [class.fleche-bas]="isTotalCollapsed == false"></i>
    </div>
    <div id="collapseTotal" [collapse]="isTotalCollapsed" [isAnimated]="true">
        <form [formGroup]="myForm">
            <input formControlName="state"
                [typeahead]="list"
                [typeaheadOptionsLimit]="7"
                [typeaheadMinLength]="0"
                typeaheadOptionField="name"
                (typeaheadOnSelect)="onSelect($event)"
                placeholder="Entrer un fournisseur"
                class="form-control">
        </form>    
        <ul class="list-group list-group-flush">
            <li class="list-group-item" *ngFor='let item of providers.value' >
                {{item.name}}<i style="float: right; cursor:pointer" (click)="deleteOneProvider(item.code)" >&#10005;</i>
            </li>
        </ul>
    </div>
</div>
