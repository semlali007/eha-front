<div class="modal-content">
    <div class="modal-header">
        <h5 class="modal-title">Ajouter un message à la discussion</h5>
        <button type="button" class="close" aria-label="Close" (click)="bsModalRef.hide()">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">

        <form novalidate id="form-message" [formGroup]="hotlineMessageForm" (ngSubmit)="submit()">
            <div class="form-group row">
                <label>Votre message</label>
                <small class="form-text text-muted">{{warning}}</small>
                <textarea class="form-control" rows="3"  [formControl]="message"></textarea>
                <span class="form-help">Vous avez tapé <b>{{message.value|countWord}} mots</b> sur 5 mots obligatoires.</span>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-primary" (click)="submit()" [disabled]="!hotlineMessageForm.valid">Valider</button>
        <button type="button" class="btn btn-secondary"   (click)="bsModalRef.hide()">Annuler</button>
    </div>
</div>
