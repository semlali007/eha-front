<div class="adm-form-group">
  <label class="adm-label">Statut</label>
  <div class="adm-radio-group">
    <label class="adm-radio" *ngFor="let s of statusList">
      <input type="radio" name="status" [formControl]="status" [value]="s.code">
      <span>{{ s.label }}</span>
    </label>
  </div>
  <span class="adm-field-hint">L'acheteur archive la fiche dès la fin du marché.</span>
</div>
