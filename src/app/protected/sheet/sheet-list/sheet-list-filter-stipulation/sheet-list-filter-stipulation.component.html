<ng-template #customItemTemplate let-model="item">
    {{model.name}} ({{ model.count }})
  </ng-template>
<div class="list-group card" style="width: 18rem;" *ngIf="list.length > 0">
    <button class="list-group-item filter-header smaller-text" (click)="isTotalCollapsed = !isTotalCollapsed"
    [attr.aria-expanded]="!isTotalCollapsed" aria-controls="stipulationList">
        Bénéficiaires <i class="fleche fleche-droite" [class.fleche-bas]="isTotalCollapsed == false"></i>
    </button>

    <div id="stipulationList" [collapse]="isTotalCollapsed" [isAnimated]="true">
        <form [formGroup]="myForm">
            <input formControlName="state"
                [typeahead]="list"
                typeaheadOptionField="name"
                [typeaheadOptionsLimit]="7"
                [typeaheadMinLength]="0"
                (typeaheadOnSelect)="onSelect($event)"
                [typeaheadItemTemplate]="customItemTemplate"
                placeholder="Entrer une stipulation pour autrui"
                class="form-control">
        </form>
        <ul class="list-group list-group-flush">
            <li class="list-group-item" *ngFor='let item of stipulationAutrui?.value' >
                {{item.name}} ({{item.count}})<i style="float: right; cursor:pointer" (click)="deleteOneStipulation(item.code)" >&#10005;</i>
            </li>
        </ul>
    </div>
</div>
