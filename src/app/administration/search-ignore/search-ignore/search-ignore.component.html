<h1>Mots à ignorer</h1>
<div class="row">
    <div class="col-3 margin-tb text-right">
        <div class="pull-right" style="padding-top:30px" style="padding-right:30px">
            <button type="button" class="btn btn-primary" (click)="openAdd()">Ajouter un élement</button>
        </div>
    </div>
</div>
<table class="table">
    <thead>
        <tr>
            <th>
                Texte
            </th>
            <th>
            </th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let factsheet of logs$ | async">
            <td>
                {{factsheet.word}}
            </td>
            <td>
                <button class="btn btn-danger" (click)="openModal(template, factsheet.id)">Supprimer</button>
            </td>
        </tr>
    </tbody>
</table>
<ng-template #template>
    <div class="modal-body text-center">
        <p>Voulez-vous supprimer l'élément?</p>
        <button type="button" class="btn btn-default" (click)="confirm()">Oui</button>
        <button type="button" class="btn btn-primary" (click)="decline()">Non</button>
    </div>
</ng-template>
