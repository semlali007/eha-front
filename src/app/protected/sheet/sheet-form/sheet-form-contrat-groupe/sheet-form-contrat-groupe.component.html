<div class="adm-form-group">
  <label class="adm-switch">
    <input type="checkbox" [checked]="isOn" (change)="onToggle($event)">
    <span class="adm-switch-track"></span>
    <span class="adm-switch-label">Contrat ouvert aux filiales</span>
  </label>
  <span class="adm-field-hint">
    Un contrat ouvert aux filiales est un contrat EDF ou ENEDIS ouvert à au moins une autre entité du Groupe (hors PEI).
  </span>
</div>
