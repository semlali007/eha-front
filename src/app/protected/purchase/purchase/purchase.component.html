<app-breadcrumb></app-breadcrumb>
<div class="row">
    <h1 class="titre">
        Ma situation achat
    </h1>
    <div class="col-12">
        <app-purchase-form (submittedForm)="onSubmittedForm($event)"></app-purchase-form>
        <hr class="hr">
        <div>
            <app-purchase-filter (purchasesChanged)="onPurchasesChanged($event)" [purchases]="purchases" 
                [filteredlist]="purchases"  [itemsPerPage]="itemsPerPage"
                 (openCloseChanged)="onOpenCloseChanged($event)" 
                 (itemsPerPageChanged)="onItemsPerPageChanged($event)" 
                 [isOpen]="isOpen"
                 ></app-purchase-filter>
            <br>
            <app-purchase-list [purchases]="filtredPurchases"  [isOpen]="isOpen" [params]="params" [itemsPerPage]="itemsPerPage"></app-purchase-list>
        </div>
    </div>
</div>
