<h1>Documentation :</h1>
<div class="text-right mt-3">
    <button type="button"  (click)="openAdd()" class="btn btn-primary">Ajouter</button>
</div>
<table class="table">
    <thead>
        <tr>
            <th>
                Position
            </th>
            <th>
                Titre
            </th>
            <th>
                lien
            </th>
            <th>
                Action
            
            </th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let item of items">
            <td>
                {{item.position}}
            </td>
            <td>
                {{item.label}}
            </td>
            <td>
                {{item.link}}
            </td>
            
            <td>
                <button (click)="openEdit(item.id)">Modifier</button>
                <button (click)="openEdit(item.id)">Supprimer</button>
            </td>
        </tr>
    </tbody>
</table>
