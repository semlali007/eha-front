<div class="row">
    <div class="col-lg-12 margin-tb">
        <div class="pull-left">
            <h1 style="color:#3276B1"><strong>Gérer la partie « Se documenter »</strong></h1>
        </div>
    </div>
</div>
<nav aria-label="breadcrumb">
    <ol class="breadcrumb my-items">
        <li class="breadcrumb-item">
            <a  (click)="showSubItems(0)"  class="blue_link"><span>Accueil</span></a>
        </li>
        
        <li *ngFor="let row of parents" class="breadcrumb-item{{(row.id == id) ? ' active' : ''}} link">
            <a (click)="showSubItems(row.id)" *ngIf="row.id != id" class="blue_link"><span
                [innerHtml]="row.breadcrumb"></span></a>
        </li>

        <li class="breadcrumb-item active">
            <span [innerHtml]="breadcrumb"></span>
        </li>
    </ol>
</nav>

<div class="row">
    <div class="col-9 margin-tb">
        <div class="pull-left" style="padding-top:30px">
            <button type="button" class="btn btn-primary" value="1" (click)="saveChange()">Enregistrer les
                modifications</button>
        </div>
    </div>
    <div class="col-3 margin-tb text-right">
        <div class="pull-right" style="padding-top:30px">
            <button type="button" class="btn btn-primary" (click)="openAdd(id)">Ajouter un élement</button>
        </div>
    </div>
</div>


<table class="table">
    <thead>
        <tr>
            <th>
                Titre
            </th>
            <th>
                Description courte
            </th>
            <th>
                lien
            </th>
            <th>
                Action
            </th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let item of items; let i = index" class="draggable" [class.active]="draggedOverIndex == i" draggable="true" (dragover)="allowDrop($event, i)" (dragstart)="onDragStart(i)"
        (drop)="onDrop($event, i)">
            <td [innerHtml]="item.label">
            </td>
            <td>
                {{item.shortdescription}}
            </td>
            <td>
                {{item.link}}
            </td>
            <td>
                <button class="btn btn-primary"  (click)="openEdit(item.id)">Modifier</button>
                <button (click)="showSubItems(item.id)" class="btn btn-secondary">Sous éléments</button>
                <button class="btn btn-danger" (click)="openModal(template, item.id)">Supprimer</button>
            </td>
        </tr>
    </tbody>
</table>
<ng-template #template>
    <div class="modal-body text-center">
      <p>Voulez-vous supprimer l'élément?</p>
      <button type="button" class="btn btn-default" (click)="confirm()" >Oui</button>
      <button type="button" class="btn btn-primary" (click)="decline()" >Non</button>
    </div>
  </ng-template>
