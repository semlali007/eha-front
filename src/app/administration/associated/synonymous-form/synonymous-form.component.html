<div class="modal-header">
    <h4 class="modal-title">Ajout d'un élément Synonyme</h4>
    <button type="button" class="close" aria-label="Close" (click)="bsModalRef.hide()">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body">
    <form novalidate (ngSubmit)="submit()" [formGroup]="factsheetAddForm">
        <div class="form-group">
            <label for="title" ><strong>Titre :</strong><span class="required">*</span></label>
            <input id="title" [formControl]="title" type="title" class="form-control" placeholder="Le titre" autocorrect="off"
                autocomplete="off" />
        </div>
        
    </form>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-primary" (click)="submit()"
        [disabled]="!factsheetAddForm.valid">Valider</button>
    <button type="button" class="btn btn-secondary" (click)="bsModalRef.hide()">Annuler</button>
</div>
