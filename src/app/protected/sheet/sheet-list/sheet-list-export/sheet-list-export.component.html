<button (click)="export()"
  class="search-btn search-btn-outline"
  [disabled]="isExporting">
  <span *ngIf="isExporting" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
  <i *ngIf="!isExporting" class="fas fa-download"></i>
  {{ isExporting ? 'Export...' : 'Exporter' }}
</button>
