<table class="table">
    <thead>
        <tr>
           
            <th>
                Origine de la demande

            </th>
            <th>
                N° DA / EB 

            </th>
            <th>
                Statut de la DA 

            </th>
            <th>
                Date de création 

            </th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let item of purchases$ | async">
            <td>
                {{item.nature}}
            </td>
            <td>
                {{item.identifiant}}
            </td>
            <td>
                {{item.eventLabel}}
            </td>
            <td>
                {{item.eventDate | date: 'dd/MM/yyyy'}}
            </td>
        </tr>
    </tbody>
</table>
