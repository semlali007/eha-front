<ng-template #customItemTemplate let-model="item">
  {{ model.name }} ({{ model.count }})
</ng-template>

<div class="list-group card" *ngIf="list.length > 0">
  <button class="list-group-item filter-header smaller-text"
    (click)="isTotalCollapsed = !isTotalCollapsed"
    [attr.aria-expanded]="!isTotalCollapsed"
    aria-controls="beneficiaryList">
    <span class="filter-header-label">Bénéficiaires <span class="filter-active-badge" *ngIf="beneficiaries?.value?.length">{{ beneficiaries.value.length }}</span></span>
    <i class="fleche fleche-droite" [class.fleche-bas]="!isTotalCollapsed"></i>
  </button>
  <div id="beneficiaryList" [collapse]="isTotalCollapsed" [isAnimated]="true">
    <form [formGroup]="myForm" class="filter-typeahead-form">
      <input formControlName="state"
        [typeahead]="list"
        container="body"
        typeaheadOptionField="name"
        [typeaheadOptionsLimit]="7"
        [typeaheadMinLength]="0"
        (typeaheadOnSelect)="onSelect($event)"
        [typeaheadItemTemplate]="customItemTemplate"
        placeholder="Entrer un bénéficiaire"
        class="form-control">
    </form>
    <ul class="list-group list-group-flush filter-tag-list">
      <li class="list-group-item filter-tag" *ngFor="let item of beneficiaries?.value">
        <span>{{ item.name }} ({{ item.count }})</span>
        <button type="button" class="filter-tag-remove" (click)="deleteOneBeneficiary(item.code)" title="Retirer">&#10005;</button>
      </li>
    </ul>
  </div>
</div>
