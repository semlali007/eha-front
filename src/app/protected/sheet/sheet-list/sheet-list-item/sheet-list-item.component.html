<div class="list-group-item" >
    
        <div>
            <table border="0">
                <tr>
                    <td>
                        <a  (click)="onSubmittedGetSheet(id)" class="link blue_link" >
            <strong>{{ title }}</strong>
                        </a>
                    </td>
                    <td>
             <button *ngIf="!!subscribed" type="button" class="btn favorite-btn" (click)="unsubscribe(id)">
                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25"  fill="rgb(255, 158, 44)" class="bi bi-star-fill"
                    viewBox="0 0 16 16">
                    <path
                        d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z" />
                </svg>
            </button>

            <button *ngIf="!subscribed" type="button" class="btn not-favorite-btn" (click)="subscribe(id)">
                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" stroke="black" fill="white" class="bi bi-star-fill"
                    viewBox="0 0 16 16">
                    <path
                        d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z" />
                </svg>
            </button>
        </td>
    </tr>
        </table>
            <br>
        </div>
        <span style="font-size:0.8em; color: black;" *ngIf="date!==createdAt"> Modifiée le
            {{date}}</span>
            <span style="font-size:0.8em; color: black;" *ngIf="date===createdAt"> Crée le
                {{createdAt}}</span>

            <span *ngIf="!!user && (user.hasRole('EHA_ADMIN') || user.hasRole('EHA_GESTIONNAIRE'))" class="badge {{status.code|sheetStatusColor}}"
            style="float:right">{{status.label}}</span>
</div>
