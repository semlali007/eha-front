<form class="my-form-for-searches" role="search" novalidate [formGroup]="homeSearchForm" (ngSubmit)="submit()">
    <div class="row">
        <div class="col-12">
            <input type="search" class="form-control" [formControl]="searchText"
                placeholder=" Saisir un ou plusieurs mots clés" id="searchText" autocorrect="off" autocomplete="off">
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-search" [disabled]="!homeSearchForm.valid">Rechercher</button>
        </div>
    </div>
</form>
