<div class="row global"  *ngIf="!!data && data.active && data.active==true && data.content">
    <div class="col-1 col-sm-1" style="padding-left: 6px;">
        <img  class="icone-info" src="../../../../assets/img/info-icon-blue.png"
            ></div>
    <div class="col-9 col-sm-9" style="margin-left: -28px;" >
        <p style="width: 107%;margin-bottom: -4px;" [innerHTML]="data?.content"></p>
    </div>
    <div class="col-2 col-sm-2 description" >
        <a (click)="openModalWithComponent()" class="link">En savoir plus</a>
    </div>
</div>
