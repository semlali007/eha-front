<div class="form-group">
    <label for="contractManager"><strong>Contract manager</strong></label>
    <span class="info-icon" 
          tooltip="Saisir le nom du contract manager, si pas nommé écrire N/A" 
          placement="top" 
          role="img" 
          aria-label="Information"></span>
    <input type="text" 
           class="form-control" 
           id="contractManager"
           [formControl]="contractManager"
           placeholder="Nom du contract manager">
    <div *ngIf="contractManager?.invalid && contractManager?.touched" class="text-danger">
        <small *ngIf="contractManager?.errors?.['minlength']">Minimum 2 caractères requis</small>
    </div>
</div>
