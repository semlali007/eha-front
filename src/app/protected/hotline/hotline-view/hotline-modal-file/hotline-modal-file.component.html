<div class="modal-content">
    <div class="modal-header">
        <h5 class="modal-title">Ajouter une pièce jointe</h5>
        <button type="button" class="close" (click)="bsModalRef.hide()" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <form [formGroup]="fileForm" (ngSubmit)="submit()">
            <div class="form-group">
                <label>Message, obligatoire, accompagnant la pièce jointe :</label>
                <input type="text" class="form-control" [formControl]="name">
            </div>
            <div class="form-group">
                <label>Sélectionner un fichier à ajouter :</label>
                <input type="file" class="form-control-file" id="file" [formControl]="file" (change)="onFileChange($event)">
                <small *ngIf="file.errors && file.dirty" class="form-text text-muted">
                    <span [hidden]="!file.errors.required">le fichier est obligatoire.</span>
                  </small>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-primary" [disabled]="!fileForm.valid"  (click)="submit()" >Valider</button>
        <button type="button" class="btn btn-secondary" (click)="bsModalRef.hide()">Annuler</button>
    </div>
</div>
