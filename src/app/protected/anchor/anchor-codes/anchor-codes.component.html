<div class="modal-header anc-modal-header">
  <h5 class="modal-title">Liste des codes/libellés NACE</h5>
  <button type="button" class="close" (click)="bsModalRef.hide()" aria-label="Close">
    <span aria-hidden="true">&times;</span>
  </button>
</div>

<form [formGroup]="codesForm">
  <div class="modal-body anc-modal-body">
    <div class="anc-codes-filters">
      <input [formControl]="codeFilter" type="text" class="form-control form-control-sm"
        placeholder="Filtrer sur le code" (input)="toggleFilter('code')">
      <input [formControl]="labelFilter" type="text" class="form-control form-control-sm"
        placeholder="Filtrer sur le labellé" (input)="toggleFilter('label')">
      <button type="button" class="btn btn-outline-secondary btn-sm anc-codes-reset" (click)="resetFilters()">
        Réinitialiser les filtres
      </button>
    </div>

    <ul class="list-group anc-codes-list">
      <li class="list-group-item anc-codes-item" [class.anc-codes-item--selected]="isSelected(row)"
        *ngFor="let row of filteredCodes">
        <span class="anc-codes-text"><b>{{ row[0] }}</b> {{ row[1] }}</span>
        <button class="btn btn-sm anc-codes-btn anc-codes-btn--add" (click)="addToList(row)" *ngIf="!isSelected(row)">
          Sélectionner
        </button>
        <button class="btn btn-sm anc-codes-btn anc-codes-btn--remove" (click)="removeItemFromList(row)" *ngIf="isSelected(row)">
          Retirer
        </button>
      </li>
      <li class="anc-codes-empty" *ngIf="filteredCodes.length === 0">
        Saisissez un code ou un libellé ci-dessus pour filtrer la liste NACE.
      </li>
    </ul>
  </div>
</form>

<div class="modal-footer anc-modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="bsModalRef.hide()">{{ closeBtnName }}</button>
</div>
