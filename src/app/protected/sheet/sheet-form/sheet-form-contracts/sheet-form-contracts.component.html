<div [formGroup]="sheetForm" class="form-group">
    <label for="contracts"><strong>Contrats :</strong><span class="required">*</span></label>
    <br>
    <input type="file" (change)="handleFileInput($event)" accept=".xlsx">
    <div *ngIf="invalidContractsCount > 0" class="alert alert-danger">{{ invalidContractsMessage }}</div>

    <div formArrayName="contracts" class="overflow-auto p-3 mb-3 mb-md-0 mr-md-3" style="max-height: 500px;">
        <app-sheet-form-contracts-item [actualState]="obj" *ngFor="let contract of contracts.controls;
          index as i;" [index]="i" [contract]="contract" [isActive]="isActive(i)"  [lotsListForContract]="tableLot" (openClose)="onOpenClose($event)" (removedContract)="onRemovedContract($event)" >
        </app-sheet-form-contracts-item>
    </div>
    <div class="text">
        <app-sheet-form-contracts-add  (addedContract)="onAddedContract()"  >
        </app-sheet-form-contracts-add>
    </div>
    <small *ngIf="contracts.errors" class="form-text text-danger">
        <span [hidden]="!contracts.errors.required">
            contrats requis.
        </span>
       
    </small>

</div>
