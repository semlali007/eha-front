<div class="form-group">
    <div class="label-with-icon">
        <label for="comments">
            <strong>Commentaires :</strong>
        </label>
        <span class="info-icon"
            tooltip="Zone libre pour communiquer toute information nécessaire non communiquée ailleurs"
            placement="top" role="img" aria-label="Information"></span>
    </div>
    <editor [formControl]="comments" 
            [init]="{
            base_url: '/tinymce', 
            suffix: '.min', 
            language: 'fr_FR',
            language_url: 'assets/langs/fr_FR.js',  
            plugins : 'advlist autolink link lists charmap print preview table',
            branding: false}">
    </editor>
</div>
