<form novalidate [formGroup]="sheetSearchForm" (ngSubmit)="submit()" class="search-form">
  <div class="search-form-inputs">
    <app-sheet-list-search-form-text [searchText]="searchText" [searchProvider]="searchProvider">
    </app-sheet-list-search-form-text>
  </div>
  <div class="search-form-actions">
    <button class="search-btn search-btn-primary" type="submit">
      <i class="fas fa-search"></i> Rechercher
    </button>
    <button class="search-btn search-btn-secondary" type="button" (click)="resetForm()">
      Réinitialiser
    </button>
  </div>
</form>
