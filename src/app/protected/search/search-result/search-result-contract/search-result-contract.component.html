    <div>
        <p>Date de mise à jour: {{updatedDate | date:'dd/MM/YYYY'}}, source : DataLake.</p>
        <div class="alert alert-warning" *ngIf="item.count == 30">
            Seuls les 30 premiers résultats sont affichés, vous devriez affiner votre recherche. En rajoutant un mot ?
        </div>
        <div class="list-group my-items-for-searches">
            <a class="list-group-item link" *ngFor="let result  of item.items" (click)="showContract(result)">
                {{result.code}} <b>{{result.label}}</b>
                <br>
                <small>{{result.other}}</small>
                <span class="badge badge-success" *ngIf="result.sheet_count > 0"  style="float:right">{{result.sheet_count}}
                    fiche(s)</span>
            </a>
        </div>
    </div>
