<div class="form-group">
    <strong>Stipulation pour autrui:</strong>
    <div class="row">
        <div class="col-sm-10">
            <tag-input [formControl]="stipulationAutrui" [placeholder]="''" [onTextChangeDebounce]="500"
                [secondaryPlaceholder]="''" [onlyFromAutocomplete]="true">
                <tag-input-dropdown [autocompleteObservable]="requestAutocompleteItems" [minimumTextLength]="3"
                    [identifyBy]="'code'" [displayBy]="'label'">
                </tag-input-dropdown>
            </tag-input>
        </div>
        <div class="col-sm-2">
            <button type="button" class="btn btn-edf" (click)="openModalWithComponent()">Stipulation</button>
        </div>
    </div>
</div>
