<div class="modal-body text-center">
    <p>Vous avez une fiche en cours de saisie. Voulez-vous la charger ou la réinitialiser?</p>
    <button type="button" class="btn btn-default" (click)="decline()" >Réinitialiser fiche</button>
    <button type="button" class="btn btn-primary" (click)="confirm()" >Reprendre la fiche en cours de saisi</button>
  </div>
