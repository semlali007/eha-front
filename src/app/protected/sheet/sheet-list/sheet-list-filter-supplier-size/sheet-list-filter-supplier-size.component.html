<div class="list-group card" style="width: 18rem;" *ngIf="list.length > 0">
    <button class="list-group-item" style="background-color: rgba(0, 0, 0, 0.03);" (click)="isTotalCollapsed = !isTotalCollapsed"
    [attr.aria-expanded]="!isTotalCollapsed" aria-controls="supplierSizeList">
        Fournisseur Taille <i class="fleche fleche-droite" [class.fleche-bas]="isTotalCollapsed == false"></i>
    </button>
    <div id="supplierSizeList" [collapse]="isTotalCollapsed" [isAnimated]="true">
    <div class="list-group list-group-flush">
        <button type="button" class="list-group-item list-group-item-action" *ngIf="supplierSize.value!='all'" (click)="changeFilter('all')"
            [class.list-group-item-success]="isActive('all')"  [attr.aria-pressed]="isActive('all')">
            Tous
        </button>        <button type="button" class="list-group-item list-group-item-action" *ngFor="let item of list" (click)="changeFilter(item.code)"
            [class.list-group-item-success]="isActive(item.code)" [attr.aria-pressed]="isActive(item.code)">
            <span class="badge" [ngClass]="getBadgeClass(item.label)">{{item.label}}</span> ({{item.count}})
        </button>
    </div>
    </div>
</div>
