<div class="adm-form-group">
  <label class="adm-switch">
    <input type="checkbox" [formControl]="$any(is_home)">
    <span class="adm-switch-track"></span>
    <span class="adm-switch-label">Afficher sur la page d'accueil</span>
  </label>
  <span class="adm-field-hint">
    L'actualité apparaîtra dans le bloc "Actualités" de la page d'accueil (si le bloc est activé).
  </span>
</div>
