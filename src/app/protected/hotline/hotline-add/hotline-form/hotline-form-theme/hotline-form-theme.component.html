<div class="form-group">
    <label>1/ Le <b>thème</b> de votre question</label>

        <option value="" disabled>Choisissez un thème</option>
        <option *ngFor="let item of themesList" [ngValue]="item.code">
            {{item.label}}
        </option>
    </select>
</div>
