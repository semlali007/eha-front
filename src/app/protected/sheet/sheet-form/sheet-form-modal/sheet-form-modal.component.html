<div class="adm-modal-header">
  <h4 class="adm-modal-title">{{ title }}</h4>
  <button type="button" class="adm-modal-close" aria-label="Fermer" (click)="bsModalRef.hide()">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
      <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854z"/>
    </svg>
  </button>
</div>

<div class="adm-modal-body sheet-modal-body">

  <!-- Ajouter un nouvel élément (types non-fournisseur) -->
  <form *ngIf="type !== 'provider'" novalidate [formGroup]="sheetModalForm" (ngSubmit)="submit()" class="sheet-modal-add">
    <div class="adm-form-group">
      <label for="sheet-modal-title" class="adm-label">Ajouter un élément</label>
      <div class="sheet-modal-search-row">
        <input id="sheet-modal-title"
               type="text"
               class="adm-input"
               [formControl]="newItem"
               placeholder="Commencez à taper pour rechercher…"
               autocorrect="off"
               autocomplete="off"
               [typeahead]="names"
               [typeaheadOptionsLimit]="7"
               [typeaheadMinLength]="2"
               (typeaheadOnSelect)="onSelect($event)">
        <button type="submit" class="adm-btn adm-btn-edf">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
          </svg>
          Ajouter
        </button>
      </div>
    </div>
  </form>

  <!-- Création d'un fournisseur (formulaire dédié) -->
  <div *ngIf="type === 'provider'" class="sheet-modal-add">
    <button type="button" class="adm-btn adm-btn-edf" (click)="openCreateProvider()">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
      </svg>
      Ajouter un fournisseur
    </button>
  </div>

  <!-- Sélection actuelle (tag-input) -->
  <div class="adm-form-group" *ngIf="selectedItems">
    <label class="adm-label">Sélection actuelle</label>
    <div class="adm-tag-input">
      <tag-input [formControl]="selectedItems"
                 [placeholder]="''"
                 [onTextChangeDebounce]="500"
                 [secondaryPlaceholder]="'Aucun élément sélectionné'"
                 [onlyFromAutocomplete]="true">
        <tag-input-dropdown [autocompleteObservable]="requestAutocompleteItems"
                            [minimumTextLength]="3"
                            [identifyBy]="'code'"
                            [displayBy]="'label'"
                            [zIndex]="1099">
        </tag-input-dropdown>
      </tag-input>
    </div>
  </div>

  <!-- Liste des résultats -->
  <div class="adm-form-group" *ngIf="items?.length > 0">
    <label class="adm-label">Résultats</label>
    <div class="sheet-modal-list">
      <div class="sheet-modal-item" *ngFor="let item of items">
        <span class="sheet-modal-item-label">{{ item.label }}</span>
        <div class="sheet-modal-item-actions">
          <button *ngIf="!isSelected(item)"
                  type="button"
                  class="adm-btn adm-btn-edf adm-btn-sm"
                  (click)="addItemToList(item)">
            Sélectionner
          </button>
          <button *ngIf="isSelected(item)"
                  type="button"
                  class="adm-btn adm-btn-ghost adm-btn-sm"
                  (click)="removeItemFromList(item.code)">
            Retirer
          </button>
          <button *ngIf="type == 'provider'"
                  type="button"
                  class="adm-btn adm-btn-ghost adm-btn-sm"
                  (click)="openEditProvider(item)">
            Éditer
          </button>
          <button *ngIf="type == 'provider' || type == 'beneficiary'"
                  type="button"
                  class="adm-btn adm-btn-danger adm-btn-sm"
                  (click)="remove(item)">
            Supprimer
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div class="sheet-modal-empty" *ngIf="!items || items.length === 0">
    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
    </svg>
    <p>Aucun résultat. Saisissez un terme dans le champ ci-dessus pour rechercher.</p>
  </div>

  <!-- Pagination -->
  <div class="adm-pagination-bar" *ngIf="total > itemsPerPage">
    <p class="adm-pagination-info">
      Affichage de <strong>{{ items?.length || 0 }}</strong> élément(s) sur <strong>{{ total }}</strong>
    </p>
    <form class="adm-pagination-wrap" [formGroup]="sheetModalForm">
      <pagination [boundaryLinks]="true"
                  [totalItems]="total"
                  [itemsPerPage]="itemsPerPage"
                  [formControl]="$any(currentPage)"
                  (pageChanged)="pageChanged($event)"
                  [maxSize]="maxSize"
                  (numPages)="smallnumPages = $event"
                  previousText="&lsaquo;"
                  nextText="&rsaquo;"
                  firstText="&laquo;"
                  lastText="&raquo;">
      </pagination>
    </form>
  </div>

</div>

<div class="adm-modal-footer">
  <button type="button" class="adm-btn adm-btn-ghost" (click)="bsModalRef.hide()">Annuler</button>
  <button type="button" class="adm-btn adm-btn-edf" (click)="validateModal()">
    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
    </svg>
    Enregistrer
  </button>
</div>

<!-- Formulaire fournisseur imbriqué (création / édition) -->
<div *ngIf="isProviderFormShown"
     [config]="{ show: true }"
     (onHidden)="onProviderFormCancel()"
     bsModal
     #providerFormModal="bs-modal"
     class="modal fade"
     tabindex="-1"
     role="dialog"
     aria-labelledby="provider-form-title">
  <div class="modal-dialog">
    <div class="modal-content">
      <app-provider-form [provider]="providerFormModel"
                         [mode]="providerFormMode"
                         (save)="onProviderFormSave($event)"
                         (cancel)="onProviderFormCancel()">
      </app-provider-form>
    </div>
  </div>
</div>

<!-- Modal de confirmation imbriqué (suppression provider/beneficiary) -->
<div *ngIf="isModalShown"
     [config]="{ show: true }"
     (onHidden)="onHidden()"
     bsModal
     #autoShownModal="bs-modal"
     class="modal fade"
     tabindex="-1"
     role="dialog"
     aria-labelledby="dialog-auto-name">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="adm-modal-body" style="text-align: center">
        <p style="margin: 0 0 14px 0; font-weight: 600; color: #1f2937">{{ modalMessage }}</p>
        <div style="display: flex; justify-content: center; gap: 8px">
          <button type="button" class="adm-btn adm-btn-ghost" (click)="decline()">Annuler</button>
          <button type="button" class="adm-btn adm-btn-danger" (click)="confirm()">Oui, supprimer</button>
        </div>
      </div>
    </div>
  </div>
</div>
