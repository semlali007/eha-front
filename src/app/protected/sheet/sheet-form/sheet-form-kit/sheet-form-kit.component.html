<div class="form-group">
    <div class="row">
        <div class="label-with-icon mr-2">
            <label for="name"><strong>{{label}}:</strong> </label>
            <i class="info-icon"
                tooltip="Insérer le ppt unique pour l'ensemble des contrats de l'affaire"
                placement="top" role="img" aria-label="Information"></i>
        </div>
        <input (change)="upload()" id="upload" type="file" ng2FileSelect [uploader]="uploader" multiple /><br />

        <div class="col-md-9" style="margin-bottom: 40px">
            <table class="table">
                <thead>
                    <tr>
                        <th width="50%">Nom</th>
                        <th></th>
                    </tr>   
                </thead>
                <tbody>
                    <tr *ngFor="let item of uploader.queue">
                        <td *ngIf="!item.options || !item.options.additionalParameter || !item.options.additionalParameter.document">
                            <strong>{{ item?.file?.name }}</strong>
                        </td>

                        <td *ngIf="!!item.options && !!item.options.additionalParameter && !!item.options.additionalParameter.document">
                            <a (click)="download(item?.options?.additionalParameter?.document)" class="link">{{ item?.file?.name }}</a>
                        </td>

                        <td nowrap>
                            <button type="button" class="btn btn-danger btn-xs"
                                (click)="item.remove();onRemove(item);">
                                <span class="glyphicon glyphicon-trash"></span> Supprimer
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<ng-template #template>
    <div class="modal-body text-center">
      <p>Le fichier est trop volumineux. La taille maximale autorisée est de 10 Mo.</p>
      <button type="button" class="btn btn-primary" (click)="confirm()" >Ok</button>
    </div>
  </ng-template>

  <ng-template #templateType>
    <div class="modal-body text-center">
      <p>Les extentions autorisées sont: PDF, Word, Excel, PowerPoint.</p>
      <button type="button" class="btn btn-primary" (click)="confirm()" >Ok</button>
    </div>
  </ng-template>
