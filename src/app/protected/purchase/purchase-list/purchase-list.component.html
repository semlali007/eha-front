<app-purchase-no-result [purchases]="purchases" [params]="params"></app-purchase-no-result>

<accordion *ngIf="purchases.length>0">
    <accordion-group #group *ngFor="let item of purchases| slice:startItem:endItem; index as i" [isOpen]="isOpen" panelClass="customClass" (isOpenChange)="loadItem($event,item)">
        <app-purchases-list-item-header  [item]="item" [slicedLabel]="item.purchase_demand_label|striphtml"  [isOpened]="opened[item.purchase_demand_id]" accordion-heading panelClass="customClass" >
        </app-purchases-list-item-header>
         <app-purchases-list-item-body  [purchase$]="data[item.purchase_demand_id]" [purchase]="item" >
        </app-purchases-list-item-body>
    </accordion-group>
    <hr class="hr">
</accordion>

<div class="row" *ngIf="purchases.length>0">
    <p class="pageText">Page {{ this.currentPage.value }} sur {{ totalPage }}</p>
    <form  [formGroup]="paginationForm">
        <nav aria-label="pagination" >
        <pagination [totalItems]='purchases.length' [itemsPerPage]="itemsPerPage"
        [formControl]="currentPage" (pageChanged)="pageChanged($event)" [maxSize]="10"
        (numPages)="smallnumPages = $event" previousText="&lsaquo;" nextText="&rsaquo;" class="paginationClass" [customNextTemplate]="nextTemplate" [customPreviousTemplate]="prevTemplate">
        </pagination>
        </nav>
    </form>
</div>


<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
    <ng-container *ngIf="!disabled">
        <img src="../../../../assets/img/pagination-activated.png">
    </ng-container>
    <ng-container *ngIf="disabled">
        <img src="../../../../assets/img/pagination-disabled.png" class="reversed">
    </ng-container>
  </ng-template>

  <ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
    <ng-container *ngIf="!disabled">
        <img src="../../../../assets/img/pagination-activated.png" class="reversed">
    </ng-container>
    <ng-container *ngIf="disabled">
        <img src="../../../../assets/img/pagination-disabled.png">
    </ng-container>
  </ng-template>
