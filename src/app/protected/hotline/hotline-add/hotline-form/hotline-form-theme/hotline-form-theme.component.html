<div class="adm-form-group">
  <label class="adm-label" for="hl-theme">Thème<span class="adm-required">*</span></label>
  <select id="hl-theme"
          class="adm-select"
          [formControl]="theme">
    <option value="" disabled>Choisissez un thème…</option>
    <option *ngFor="let item of themesList" [ngValue]="item.code">{{ item.label }}</option>
  </select>
  <span class="adm-field-error" *ngIf="submitted && theme?.errors?.required">Le thème est obligatoire.</span>
</div>
