<header class="banner" role="banner">
  <!-- Desktop header -->
  <div class="banner-desktop">
    <!-- Ligne 1 : Logo + titre + user -->
    <div class="banner-top">
      <a (click)="navigate(homePath)" class="banner-brand">
        <img
          src="assets/img/logo-edf-blanc.png"
          alt="EDF"
          class="banner-logo"
        />
      </a>

      <div class="banner-center">
        <strong class="banner-app-name">Achatpédia</strong>
        <span class="banner-app-desc mr-2"
          >Votre espace de documentation, de recherche et de contacts sur les
          achats</span
        >
      </div>

      <div class="banner-user" *ngIf="!!user && user.nni">
        <div class="banner-user-info">
          <img src="assets/img/icon-profil.png" class="banner-user-icon" />
          <span class="banner-user-name">{{ user.name }}</span>
        </div>
        <button
          class="banner-icon-btn"
          (click)="logout()"
          title="Se déconnecter"
        >
          <img src="assets/img/se_deconnecter.png" class="banner-action-icon" />
        </button>
        <button
          class="banner-icon-btn banner-notif-btn"
          (click)="openModal()"
          title="Notifications"
        >
          <img
            src="assets/img/icone-notification-blanc.png"
            class="banner-action-icon"
          />
          <span class="banner-notif-badge" *ngIf="numberOfNotifications > 0">{{
            numberOfNotifications
          }}</span>
        </button>
      </div>
    </div>

    <!-- Ligne 2 : Navigation -->
    <nav class="banner-nav" *ngIf="!!user && user.nni">
      <a (click)="navigate(homePath)" class="banner-nav-item banner-nav-home">
        <img src="assets/img/icon-home.png" class="banner-nav-icon" /> Accueil
      </a>
      <div class="banner-nav-links">
        <a (click)="forceNavigate('search_component')" class="banner-nav-item">
          <img
            src="assets/img/icon-search-header.png"
            class="banner-nav-icon"
          />
          Rechercher <img src="assets/img/caret.png" class="banner-nav-caret" />
        </a>
        <a (click)="navigate(purchasePath)" class="banner-nav-item">
          <img
            src="assets/img/icon-panier-header.png"
            class="banner-nav-icon"
          />
          Ma situation achat
        </a>
        <a (click)="navigate(sheetPath)" class="banner-nav-item">
          <img
            src="assets/img/icon-marches-cadres.png"
            class="banner-nav-icon"
          />
          Vitrine de l'offre
        </a>
        <a (click)="forceNavigate('documentation')" class="banner-nav-item">
          <img
            src="assets/img/icon-se-documenter-header.png"
            class="banner-nav-icon"
          />
          Se documenter
          <img src="assets/img/caret.png" class="banner-nav-caret" />
        </a>
        <a (click)="forceNavigate('contact_component')" class="banner-nav-item">
          <img
            src="assets/img/icon-contacter-header.png"
            class="banner-nav-icon"
          />
          Contacter <img src="assets/img/caret.png" class="banner-nav-caret" />
        </a>
      </div>
    </nav>
  </div>

  <!-- Mobile header -->
  <div class="banner-mobile">
    <div class="banner-mobile-top">
      <button
        class="banner-mobile-menu"
        (click)="isCollapsed = !isCollapsed"
        [attr.aria-expanded]="!isCollapsed"
        aria-controls="mobileNav"
      >
        <i class="fas fa-bars"></i>
      </button>
      <a (click)="navigate(homePath)" class="banner-mobile-brand">
        <img src="assets/img/logo-edf-mobile.png" alt="EDF" />
        <span>Accueil</span>
      </a>
      <button
        class="banner-icon-btn"
        *ngIf="!!user && user.nni"
        (click)="openModal()"
      >
        <img
          src="assets/img/icone-notification-blanc-mobile.png"
          class="banner-action-icon"
        />
        <span class="banner-notif-badge" *ngIf="numberOfNotifications > 0">{{
          numberOfNotifications
        }}</span>
      </button>
    </div>
    <div
      id="mobileNav"
      [collapse]="isCollapsed"
      [isAnimated]="true"
      *ngIf="!!user && user.nni"
    >
      <nav class="banner-mobile-nav">
        <a
          (click)="forceNavigate('search_component')"
          class="banner-mobile-nav-item"
        >
          <img
            src="assets/img/icon-search-header.png"
            class="banner-nav-icon"
          />
          Rechercher
        </a>
        <a (click)="navigate(purchasePath)" class="banner-mobile-nav-item">
          <img
            src="assets/img/icon-panier-header.png"
            class="banner-nav-icon"
          />
          Ma situation achat
        </a>
        <a (click)="navigate(sheetPath)" class="banner-mobile-nav-item">
          <img
            src="assets/img/icon-marches-cadres.png"
            class="banner-nav-icon"
          />
          Vitrine de l'offre
        </a>
        <a
          (click)="forceNavigate('documentation')"
          class="banner-mobile-nav-item"
        >
          <img
            src="assets/img/icon-se-documenter-header.png"
            class="banner-nav-icon"
          />
          Se documenter
        </a>
        <a
          (click)="forceNavigate('contact_component')"
          class="banner-mobile-nav-item"
        >
          <img
            src="assets/img/icon-contacter-header.png"
            class="banner-nav-icon"
          />
          Contacter
        </a>
      </nav>
    </div>
  </div>
</header>
