<form class="row" [formGroup]="option">
  <div class="col-sm-3">
    <div class="pt-2">
      <label>Option {{index + 1}} :</label>
    </div>
  </div>
  <div class="col-sm-4">
    <div class="align-items-center d-flex">
    <span class="pr-4">Du</span>
    <input
        formControlName="startDate" 
        placeholder="Date de début"
        class="form-control"
        [bsConfig]="{ containerClass: 'theme-dark-blue' }"
        bsDatepicker>
    </div>
  </div>

  <div class="col-sm-4">
    <div class="align-items-center d-flex">
    <span class="pr-4">au</span>
    <input  
        formControlName="endDate"
        placeholder="Date de fin"
        class="form-control"
        [bsConfig]="{ containerClass: 'theme-dark-blue' }"
        bsDatepicker>
    </div>
  </div>
  <div class="col-sm-1">
    <button class="remove" (click)="confirmation(template)">-</button>
  </div>
  <p style="margin-left:51%" [hidden]="!option.errors?.customValidator">Date invalide</p>  
 
</form>

<ng-template #template>
  <div class="modal-body text-center">
    <p>Voulez-vous confirmer la suppression ?</p>
    <button type="button" class="btn btn-default" (click)="confirm()">Oui</button>
    <button type="button" class="btn btn-primary" (click)="decline()">Non</button>
  </div>
</ng-template>
