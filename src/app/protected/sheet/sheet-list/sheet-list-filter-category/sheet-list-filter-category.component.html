<div class="list-group card" *ngIf="list && list.length > 0">
  <button class="list-group-item filter-header smaller-text"
    (click)="isTotalCollapsed = !isTotalCollapsed"
    [attr.aria-expanded]="!isTotalCollapsed"
    aria-controls="categoryList">
    <span class="filter-header-label">Catégorie d'achat <span class="filter-active-badge" *ngIf="categories?.value?.length">{{ categories.value.length }}</span></span>
    <i class="fleche fleche-droite" [class.fleche-bas]="!isTotalCollapsed"></i>
  </button>
  <div id="categoryList" [collapse]="isTotalCollapsed" [isAnimated]="true">
    <div class="list-group list-group-flush">
      <button class="list-group-item list-group-item-action"
        (click)="changeFilter('all')"
        [class.list-group-item-success]="isActive('all')"
        [attr.aria-pressed]="isActive('all')">
        Tous
      </button>
      <button class="list-group-item list-group-item-action"
        *ngFor="let item of list | slice:0:5"
        (click)="changeFilter(item.code)"
        [class.list-group-item-success]="isActive(item.code)"
        [attr.aria-pressed]="isActive(item.code)">
        {{ item.name }} ({{ item.count }})
      </button>
    </div>
    <div class="list-group list-group-flush" [collapse]="isCollapsed" [isAnimated]="true">
      <button class="list-group-item list-group-item-action"
        *ngFor="let item of list | slice:5:14"
        (click)="changeFilter(item.code)"
        [class.list-group-item-success]="isActive(item.code)"
        [attr.aria-pressed]="isActive(item.code)">
        {{ item.name }} ({{ item.count }})
      </button>
    </div>
    <button *ngIf="list.length > 5" type="button" class="btn btn-edf" (click)="showMore()">
      {{ textButton }}
    </button>
  </div>
</div>
