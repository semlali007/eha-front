<div class="list-group card">
  <button class="list-group-item filter-header smaller-text"
    (click)="isTotalCollapsed = !isTotalCollapsed"
    [attr.aria-expanded]="!isTotalCollapsed"
    aria-controls="statusList">
    <span class="filter-header-label">Statut <span class="filter-active-badge" *ngIf="status?.value?.length">{{ status.value.length }}</span></span>
    <i class="fleche fleche-droite" [class.fleche-bas]="!isTotalCollapsed"></i>
  </button>
  <div id="statusList" [collapse]="isTotalCollapsed" [isAnimated]="true">
    <div class="list-group list-group-flush">
      <button type="button" class="list-group-item list-group-item-action"
        *ngIf="status.value !== 'all'"
        (click)="changeFilter('all')"
        [class.list-group-item-success]="isActive('all')"
        [attr.aria-pressed]="isActive('all')">
        Tous
      </button>
      <ng-container *ngIf="list.length === 0">
        <button type="button" class="list-group-item list-group-item-action"
          (click)="changeFilter(-1)"
          [class.list-group-item-success]="isActive(-1)"
          [attr.aria-pressed]="isActive(-1)">
          Archivée (0)
        </button>
        <button type="button" class="list-group-item list-group-item-action"
          (click)="changeFilter(0)"
          [class.list-group-item-success]="isActive(0)"
          [attr.aria-pressed]="isActive(0)">
          Brouillon (0)
        </button>
        <button type="button" class="list-group-item list-group-item-action"
          (click)="changeFilter(1)"
          [class.list-group-item-success]="isActive(1)"
          [attr.aria-pressed]="isActive(1)">
          Publiée (0)
        </button>
      </ng-container>
      <button type="button" class="list-group-item list-group-item-action"
        *ngFor="let item of list"
        (click)="changeFilter(item.code)"
        [class.list-group-item-success]="isActive(item.code)"
        [attr.aria-pressed]="isActive(item.code)">
        {{ item.label }} ({{ item.count }})
      </button>
    </div>
  </div>
</div>
