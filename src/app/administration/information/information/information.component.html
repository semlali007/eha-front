<h1>Administration les infos ( Page Accueil)</h1>

<div class="row">
    <div class="col-3 margin-tb text-right">
        <div class="pull-right" style="padding-top:30px" style="padding-right:30px">
            <button type="button" class="btn btn-primary" (click)="openAdd()">Ajouter un élement</button>
        </div>
    </div>
</div>

<table class="table">
    <thead>
        <tr>
            <th>
                Id
            </th>
            <th>
                Page
            </th>
            <th>
                Datte début
            </th>
            <th>
                Datte fin
            </th>
            <th>
                Titre
            </th>
       
           
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let information of informations$ | async">
            <td>
                {{information.id}}
            </td>
            <td>
                {{information.type}}
            </td>
            <td>
                {{information.start_date}}
            </td>
            <td>
                {{information.end_date}}
            </td>

            <td [innerHtml]="information.short_description">
            </td>

            
            <td>
                <button class="btn btn-primary" (click)="openAdd(information.id)">Modifier</button>
                <button class="btn btn-danger" (click)="openModal(template, information.id)" >Supprimer</button>
            </td>
        </tr> 

    </tbody>
</table>

<ng-template #template>
    <div class="modal-body text-center">
      <p>Voulez-vous supprimer l'élément?</p>
      <button type="button" class="btn btn-default" (click)="confirm()" >Oui</button>
      <button type="button" class="btn btn-primary" (click)="decline()" >Non</button>
    </div>
  </ng-template>
