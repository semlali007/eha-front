<div  class="row cadre-item-purchase" >
    <p class="text" [innerHTML]="purchase.purchase_demand_label | safe: 'html'" ></p>
    <div  *ngFor="let data of (purchase$ | async); ">
        <div class="col-12">&nbsp;</div>
        <div class="col-2">
            <table>
                <tr>
                    <td>
                        <div  class="flow-grey" >
                            <p class="title">
                            <img src='{{ "../../../../../assets/img/" + status[data.step.event_label].icon + ".png" }}'>&nbsp;&nbsp;{{status[data.step.event_label].label}}</p>
                            <p class="text-flow-content" >Le {{data.step.event_date|customDate}}</p>
                            <p class="text-flow-source" *ngIf="data.viewPerson==true">{{data.step.event_person}}</p>
                            <p class="text-flow-source" >Source: {{data.step.nature}}</p>
                        </div>
                    </td>
                    <td>
                      <img src='{{"../../../../../assets/img/" + status[data.step.event_label].img + ".png" }}'> 
                    </td>
                </tr>
            </table>
        </div>
        <div>&nbsp;&nbsp;&nbsp;&nbsp;</div>
    </div>
</div>
