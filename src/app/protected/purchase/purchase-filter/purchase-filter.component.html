<div class="row">
    <div class="col-2" >
        <h1 class="titre-result">
            {{filteredlist.length}} demande<span *ngIf="filteredlist.length > 1">s</span> d'achat </h1>
    </div>
    <div class="col-3" >
        <p *ngIf="isFiltered()" >&nbsp;avec vos critères de recherche</p>
         </div>
        <div class="col-2" >
            <a *ngIf="isFiltered()" class="open-da" (click)="clearFilter()">Supprimer mes critères</a>
            </div>
    <div class="col-2" *ngIf='isOpen!=true'>
        <a class="open-da" (click)="open()"><img src="../../../../assets/img/icon-list-da.png">&nbsp;Ouvrir toutes les DA</a>
        </div>
    <div class="col-2" *ngIf='isOpen==true'>
        <a class="open-da" (click)="close()"><img src="../../../../assets/img/icon-list-da.png">&nbsp;Fermer toutes les DA</a>
    </div>
    <div >
        <p class="text-simple">DA par page</p>
    </div>
    <div class="col-1">
        <div class="btn-group" dropdown style="width:100px">
            <button id="button-basic" dropdownToggle type="button"
                class="btn btn-default ddown-per-page dropdown-toggle"
                aria-controls="dropdown-basic">{{itemsPerPage}}
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="caret"></span>
            </button>
            <ul id="dropdown-basic" *dropdownMenu class="dropdown-menu" role="menu" aria-labelledby="button-basic">
                <li role="menuitem"><a class="dropdown-item" (click)="changePerPage(10)">10</a></li>
                <li role="menuitem"><a class="dropdown-item" (click)="changePerPage(20)">20</a></li>
                <li role="menuitem"><a class="dropdown-item" (click)="changePerPage(30)">30</a></li>
            </ul>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-2">
        <p class="t-key element">Numéro <a href="javascript: void(0);" (click)="sort({'column':'purchase_demand_id'})" ><img class="img-left"
                src="../../../../assets/img/flech-down.png"><img class="img"
                src="../../../../assets/img/flech-up.png"></a></p>
        <input type="text" class="form-control text-field-filter" [formControl]="filterCode" (keyup)="filter()"
            placeholder="Saisir pour filtrer la liste">
    </div>
    <div class="col-4">
        <p class="t-key element">Libellé <a href="javascript: void(0);" (click)="sortText({'column':'purchase_demand_label'})"><img class="img-left-label" src="../../../../assets/img/flech-down.png"><img
                class="img" src="../../../../assets/img/flech-up.png"></a></p>
        <input type="text" class="form-control text-field-filter" placeholder="Saisir pour filtrer la liste"
            [formControl]="filterLabel" (keyup)="filter()">
    </div>

    <div class="col-2">
        <p class="t-key element">Crée le <a href="javascript: void(0);" (click)="sortDate({'column':'purchase_created_date'})"><img class="img-left" src="../../../../assets/img/flech-down.png"><img
                class="img" src="../../../../assets/img/flech-up.png"> </a></p>
    </div>
    <div class="col-2">
        <p class="t-key element">Statut <a href="javascript: void(0);" (click)="sort({'column':'last_status_event'})"><img class="img-left" src="../../../../assets/img/flech-down.png"><img class="img"
                src="../../../../assets/img/flech-up.png"></a> </p>
        <div class="btn-group" dropdown [insideClick]="true">
            <button id="button-basic" dropdownToggle type="button"
                class="btn btn-default ddown-per-page dropdown-toggle" aria-controls="dropdown-basic">
                Tous&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <span class="caret"></span>
            </button>
            <ul *dropdownMenu class="dropdown-menu" role="menu">
                <li role="menuitem"><a class="dropdown-item" (click)="changeStatus({'status':'validated'})"  >
                        <img src="../../../../assets/img/icone-valide.png">&nbsp;&nbsp;<span [class.font-weight-bold]="validated">Validée</span></a>
                </li>
                <li role="menuitem"><a class="dropdown-item"  (click)="changeStatus({'status':'created'})">
                        <img src="../../../../assets/img/icon-cree.png">&nbsp;&nbsp;<span [class.font-weight-bold]="created">Créee</span></a></li>
                <li role="menuitem"><a class="dropdown-item" (click)="changeStatus({'status':'instructed'})">
                        <img src="../../../../assets/img/icon-en-instruction.png">&nbsp;&nbsp;<span [class.font-weight-bold]="instructed">En instruction</span></a>
                </li>
                <li role="menuitem"><a class="dropdown-item"   (click)="changeStatus({'status':'refused'})">
                        <img src="../../../../assets/img/icon-refuse.png">&nbsp;&nbsp;<span [class.font-weight-bold]="refused">Refusée</span></a>
                </li>
            </ul>
        </div>
    </div>
    <div class="col-2">
        <p class="t-key element">Statut modifié le <a href="javascript: void(0);" (click)="sortDate({'column':'last_status_date'})"><img class="img-left" src="../../../../assets/img/flech-down.png"><img
            class="img" src="../../../../assets/img/flech-up.png"> </a></p>
    </div>
</div>
