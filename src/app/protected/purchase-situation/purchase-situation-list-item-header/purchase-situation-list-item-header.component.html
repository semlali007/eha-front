<div class="row">
<hr class="ligne-table">
<div class="col-2">
    <p class="text" *ngIf="!isOpened;else opened"><img src='../../../../assets/img/element-table.png' class="dark-blue"><img src="../../../../assets/img/element-table-hover.png" class="light-blue">&nbsp;&nbsp;&nbsp;{{item.need_system_id}}</p>
</div>
<div class="col-3" style="padding: 0;">
    <p class="text">{{slicedLabel|slice:0:40}}<span *ngIf="slicedLabel.length >45">..</span></p>
</div>
<div class="col-1">
    <p class="text">{{item.need_system_validation_date|customDate}}</p>
</div>
<div class="col-2">
    <p class="text">{{item.main_mtb_status_label}}</p>
</div>
<div class="col-2">
    <p class="text">{{item.main_mtb_status_last_event_date|customDate}}</p>
</div>
<div class="col-2">
    <p class="text">{{item.owner_label}}</p>
</div>
<div class="col-2">
    <p class="text">{{item.last_status_date|customDate}}</p>
</div>
</div>
<ng-template #opened><p class="text"><img src='../../../../assets/img/element-table-bas.png' class="dark-blue"><img src="../../../../assets/img/element-table-hover.png" [ngClass]="{'light-blue' : true, 'light-blue-rotate':isOpened}">&nbsp;&nbsp;&nbsp;{{item.purchase_demand_id}}</p></ng-template>
