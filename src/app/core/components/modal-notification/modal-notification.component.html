<div class="modal-body">
  <div class="row">
    <div class="col-2">
      <img class="mt-3" src="../../../../assets/img/info-icon.png" />
    </div>
    <div class="col-10 text-justify">
      <div class="offset-11">
        <span aria-hidden="true" style="cursor:pointer" class="visually-hidden close d-inline" (click)="hideModal()"
          aria-label="Close">&times;</span>
      </div>
      <h1 class="font-weight-bold pt-2 ">Liste des notifications</h1>
      <p class="pr-3"></p>
      <table class="table">
        <tbody>
          <tr *ngFor="let i of list">
            <td>
              <p class="font-weight-light">La fiche marché {{ i.sheet_id}} a été modifiée le {{ i.updated_at | date:
                'dd/MM/yyyy' }}</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
