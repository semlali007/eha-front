<div class="list-group cadre">
  <div class="row-table full-width">
    <div class="col-5"><p class="titre-cadre">
      <img src="../../../../assets/img/icon-se-documenter.png">&nbsp;Se documenter</p></div>
    <div class="col-7"><p class="p-danger">Accès limité aux collaborateurs d'EDF</p></div>
  </div>
  <p class="p" style="margin-left:15px;">Accéder à des aides et ressources documentaires adaptées à chaque phase du processus Achat :</p>
  <table class="table-se-doc">
    <tr  *ngFor="let document of section">
      <td class="td"><p class="titre-2 link" (click)="navigate(document)" [innerHtml]="document.label"> </p></td>
      <td class="td"><p class="p mx-0 my-0">{{document.shortdescription}}</p></td>
    </tr>
  </table>
</div>
