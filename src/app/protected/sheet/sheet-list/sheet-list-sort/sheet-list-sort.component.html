<form novalidate [formGroup]="sheetSortForm" class="sort-form">
  <button *ngIf="stateClosed" class="search-btn search-btn-outline" type="button" (click)="changeState()">
    <i class="fas fa-sort"></i> Trier
  </button>
  <select *ngIf="!stateClosed" class="sort-select" name="sortBy" [formControl]="sortBy" id="sortBy" (change)="changeSort($event)">
    <option value="date_desc">Date (récente)</option>
    <option value="date_asc">Date (ancienne)</option>
    <option value="title_asc">Titre (A→Z)</option>
    <option value="title_desc">Titre (Z→A)</option>
  </select>
</form>
