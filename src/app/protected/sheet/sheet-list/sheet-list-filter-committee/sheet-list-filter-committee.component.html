<div class="card" style="width: 18rem;" *ngIf="list.length > 0">
    <div class="card-header link smaller-text" (click)="isTotalCollapsed = !isTotalCollapsed"
    [attr.aria-expanded]="!isTotalCollapsed" aria-controls="collapseTotal">
    Comité de Gestion de la Demande <i class="fleche fleche-droite" [class.fleche-bas]="isTotalCollapsed == false"></i>
    </div>
    <div id="collapseTotal" [collapse]="isTotalCollapsed" [isAnimated]="true">
    <ul class="list-group list-group-flush">
        <li class="list-group-item link" *ngIf="committees.value.length>0" (click)="changeFilter('all')"
            [class.list-group-item-success]="isActive('all')">
            Tous
        </li>

        <li class="list-group-item link" *ngFor="let item of list|slice:0:4" (click)="changeFilter(item.code)"
            [class.list-group-item-success]="isActive(item.code)">
            {{item.name}} ({{item.count}})
        </li>
    </ul>

    <ul class="list-group list-group-flush" id="collapseBasic" [collapse]="isCollapsed" [isAnimated]="true">
        <li class="list-group-item link" *ngFor="let item of list|slice:5:14" (click)="changeFilter(item.code)"
            [class.list-group-item-success]="isActive(item.code)">
            {{item.name}} ({{item.count}})
        </li>
    </ul>

    <button *ngIf="!!list && list.length > 5" type="button" class="btn btn-edf" (click)="showMore()"
        [attr.aria-expanded]="!isCollapsed" aria-controls="collapseBasic">
        {{textButton}}
    </button>
    </div>
</div>
